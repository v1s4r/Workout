<title>Athletic Care — Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#151513;
    --panel2:#1d1d1a;
    --yellow:#F6EA26;
    --yellow-dim:#c9c020;
    --text:#f5f5f0;
    --text-dim:#95958c;
    --border:#2a2a26;
    --danger:#e29b9b;
    --danger-dim:#8a5f5f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Inter',sans-serif; color:var(--text); min-height:100vh; display:flex; justify-content:center;}
  #app{width:100%; max-width:480px; min-height:100vh; background:var(--bg); padding-bottom:40px; position:relative;}
  .display{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:0.3px;}
  h1,h2,h3{margin:0; font-weight:400;}

  .topbar{display:flex; align-items:center; gap:12px; padding:22px 18px 14px;}
  .topbar img{width:38px;height:38px;display:block;}
  .topbar .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .topbar .brand-text .b1{font-family:'Anton'; font-size:18px; letter-spacing:0.5px;}
  .topbar .brand-text .b2{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; margin-top:2px;}
  .back-row{display:flex; align-items:center; justify-content:space-between; padding:18px 18px 4px;}
  .back-btn{background:none; border:1px solid var(--border); color:var(--text); padding:9px 14px; border-radius:3px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; font-family:'Inter';}
  .back-btn:active{background:var(--panel2);}

  .hero{padding:6px 18px 14px;}
  .hero .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--yellow); font-weight:700;}
  .hero h1{font-size:24px; margin-top:6px; line-height:1.1;}

  .section-label{padding:4px 18px 10px; font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-dim); font-weight:700;}

  .routine-list{padding:0 18px;}
  .routine-card{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:14px 14px; margin-bottom:12px; cursor:pointer;
  }
  .routine-card:active{background:var(--panel2);}
  .routine-glyph{
    width:38px; height:38px; border-radius:50%; background:var(--panel2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-family:'Anton'; font-size:17px; color:var(--yellow);
    flex-shrink:0;
  }
  .routine-info{flex:1; min-width:0;}
  .routine-name{font-family:'Anton'; font-size:17px; letter-spacing:0.3px;}
  .routine-sub{font-size:11.5px; color:var(--text-dim); margin-top:3px; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .start-btn{
    background:var(--yellow); color:#0a0a0a; border:none; border-radius:20px;
    padding:9px 16px; font-weight:800; font-size:11.5px; text-transform:uppercase;
    letter-spacing:0.4px; flex-shrink:0;
  }

  .reset-link{display:block; text-align:center; margin:26px auto 0; color:var(--text-dim); font-size:11px; background:none; border:none; text-decoration:underline; letter-spacing:0.3px;}

  .workout-header{display:flex; align-items:center; gap:12px; padding:16px 18px 6px;}
  .icon-x{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    width:34px; height:34px; border-radius:50%; font-size:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .wh-mid{flex:1; min-width:0;}
  .wh-title{font-family:'Anton'; font-size:19px; letter-spacing:0.3px;}
  .wh-timer{font-size:12px; color:var(--yellow); font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; letter-spacing:0.3px;}
  .finish-btn{
    background:var(--yellow); color:#0a0a0a; border:none; border-radius:20px;
    padding:9px 16px; font-weight:800; font-size:12px; text-transform:uppercase;
    letter-spacing:0.4px; flex-shrink:0;
  }

  .warmup-note{
    margin:10px 18px 4px; padding:11px 14px; background:var(--panel2); border:1px solid var(--border);
    border-radius:4px; font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:8px;
  }

  .ex-card{background:var(--panel); border:1px solid var(--border); border-radius:5px; margin:12px 18px; padding:14px;}
  .ex-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .ex-name{font-size:15px; font-weight:700;}
  .ex-meta{font-size:10.5px; color:var(--yellow-dim); margin-top:3px; letter-spacing:0.6px; text-transform:uppercase; font-weight:700;}
  .ex-icons{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{background:var(--panel2); border:1px solid var(--border); color:var(--text-dim); width:28px; height:28px; border-radius:3px; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .icon-btn.danger{color:var(--danger);}
  .icon-btn.chart-btn{color:var(--yellow); border-color:var(--yellow-dim);}

  .set-table{display:grid; grid-template-columns:24px 1fr 52px 44px 32px; gap:6px 7px; margin-top:12px; align-items:center;}
  .set-table .thead{font-size:9px; text-transform:uppercase; color:var(--text-dim); font-weight:700; letter-spacing:0.4px; padding-bottom:2px;}
  .set-num{font-family:'Anton'; font-size:13px; color:var(--text-dim); text-align:center;}
  .set-row.done .set-num{color:var(--yellow);}
  .set-prev{font-size:11px; color:var(--text-dim);}
  .set-input{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:3px; padding:7px 2px; font-size:13.5px; text-align:center; font-family:'Inter'; font-weight:600;
  }
  .set-input:focus{outline:none; border-color:var(--yellow);}
  .set-static{font-size:13.5px; font-weight:700; text-align:center; color:var(--yellow);}
  .set-check{
    width:28px; height:28px; border-radius:50%; border:1.5px solid var(--border); background:var(--panel2);
    display:flex; align-items:center; justify-content:center; color:transparent; font-size:13px; font-weight:800;
  }
  .set-check.done{background:var(--yellow); border-color:var(--yellow); color:#0a0a0a;}
  .add-set-row{
    display:block; margin-top:10px; background:none; border:none; color:var(--text-dim);
    font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; padding:4px 0;
  }

  .add-ex-btn{display:block; width:calc(100% - 36px); margin:14px 18px 8px; background:none; border:1.5px dashed var(--border); color:var(--text-dim); padding:15px; border-radius:5px; font-size:12.5px; text-transform:uppercase; letter-spacing:0.6px; font-weight:700;}

  .inline-form{background:var(--panel); border:1px solid var(--border); border-radius:5px; margin:12px 18px; padding:16px;}
  .inline-form label{font-size:10px; text-transform:uppercase; color:var(--text-dim); letter-spacing:0.5px; display:block; margin-bottom:5px;}
  .inline-form input{width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:3px; padding:11px 10px; font-size:14.5px; margin-bottom:12px; font-family:'Inter';}
  .inline-form input:focus{outline:none; border-color:var(--yellow);}
  .form-row{display:flex; gap:10px;}
  .form-btn{flex:1; padding:11px; border-radius:3px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; border:none;}
  .form-btn.primary{background:var(--yellow); color:#0a0a0a;}
  .form-btn.ghost{background:none; border:1px solid var(--border); color:var(--text-dim);}

  .empty-state{padding:40px 18px; text-align:center; color:var(--text-dim); font-size:13px; line-height:1.6;}

  .ex-detail-head{padding:4px 18px 2px;}
  .ex-detail-head .eyebrow{font-size:11px; color:var(--yellow); text-transform:uppercase; letter-spacing:2px; font-weight:700;}
  .ex-detail-head h2{font-family:'Anton'; font-size:24px; margin-top:6px;}
  .ex-detail-head .code{font-size:12px; color:var(--text-dim); margin-top:4px;}

  .chart-card{background:var(--panel); border:1px solid var(--border); border-radius:5px; margin:16px 18px; padding:16px 12px 12px;}
  .chart-hero{display:flex; align-items:flex-start; justify-content:space-between; padding:0 6px; margin-bottom:6px;}
  .chart-hero-left{display:flex; align-items:baseline; gap:8px;}
  .chart-hero-val{font-family:'Anton'; font-size:27px; color:var(--text); letter-spacing:0.3px;}
  .chart-hero-date{font-size:12.5px; color:var(--text-dim);}
  .pr-badge{
    background:var(--yellow); color:#0a0a0a; font-family:'Anton'; font-size:11px;
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--yellow-dim); flex-shrink:0;
  }
  .chart-delta{font-size:12px; color:var(--text-dim); margin-bottom:10px; padding:0 6px;}
  .chart-delta b{color:var(--yellow); font-weight:800;}
  .chart-svg{width:100%; height:auto; display:block;}

  .hist-list{margin:0 18px;}
  .hist-title{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin:20px 0 10px; font-weight:700;}
  .hist-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border); font-size:13px; gap:10px;}
  .hist-row .sets-txt{font-weight:600;}
  .hist-row .d{color:var(--text-dim); font-size:11.5px; white-space:nowrap;}
  .hist-row .del{color:var(--danger-dim); font-size:12px; background:none; border:none; padding:6px; flex-shrink:0;}

  ::selection{background:var(--yellow); color:#0a0a0a;}

  .timer-bar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; display:flex; gap:10px;
    background:#101010; border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    z-index:50;
  }
  .timer-block{
    flex:1; display:flex; align-items:center; justify-content:space-between;
    background:var(--panel2); border:1px solid var(--border); border-radius:5px;
    padding:8px 8px 8px 12px;
  }
  .timer-label{font-size:9px; text-transform:uppercase; color:var(--text-dim); letter-spacing:0.8px; font-weight:700;}
  .timer-value{font-family:'Anton'; font-size:19px; letter-spacing:0.5px; margin-top:1px; font-variant-numeric:tabular-nums;}
  .timer-btn{
    background:var(--yellow); color:#0a0a0a; border:none; border-radius:3px;
    padding:8px 12px; font-size:11px; font-weight:800; text-transform:uppercase;
    letter-spacing:0.4px; flex-shrink:0;
  }
  .timer-btn.running{background:var(--danger); color:#2a0a0a;}
  .timer-spacer{height:88px;}

  .workoutz-btn{
    display:block; width:calc(100% - 36px); margin:4px 18px 24px;
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:15px; border-radius:6px; font-size:14px; font-weight:700;
    letter-spacing:0.3px;
  }
  .workoutz-btn:active{background:var(--panel2);}

  /* ---- Workoutz Tabellen-Ansicht ---- */
  .sheet-scroll{
    overflow:auto; -webkit-overflow-scrolling:touch;
    max-height:calc(100vh - 200px);
    margin:14px 12px 100px;
    border:1px solid var(--border); border-radius:6px;
  }
  table.sheet-table{border-collapse:separate; border-spacing:0; font-size:11.5px; white-space:nowrap;}
  table.sheet-table th, table.sheet-table td{
    border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    padding:6px 7px; background:var(--bg);
  }
  table.sheet-table thead th{
    position:sticky; top:0; z-index:2; background:#141410; color:var(--text-dim);
    font-size:9.5px; text-transform:uppercase; letter-spacing:0.4px; font-weight:700;
  }
  table.sheet-table .lbl-col{
    position:sticky; left:0; z-index:1; background:var(--panel);
  }
  table.sheet-table .lbl-col2{
    position:sticky; left:96px; z-index:1; background:var(--panel);
  }
  table.sheet-table .lbl-col3{
    position:sticky; left:172px; z-index:1; background:var(--panel);
  }
  table.sheet-table thead th.lbl-col, table.sheet-table thead th.lbl-col2, table.sheet-table thead th.lbl-col3{
    z-index:3; background:#141410;
  }
  .sheet-name-input{
    width:88px; background:none; border:none; color:var(--text); font-weight:700; font-size:11.5px;
    padding:2px; white-space:normal;
  }
  .sheet-name-input:focus{outline:1px solid var(--yellow); border-radius:2px;}
  .sheet-group-input{
    width:70px; background:none; border:none; color:var(--yellow-dim); font-size:10.5px; font-weight:700;
    text-transform:uppercase; padding:2px;
  }
  .sheet-group-input:focus{outline:1px solid var(--yellow); border-radius:2px;}
  .sheet-rowtype{color:var(--text-dim); font-size:10px; text-transform:uppercase; font-weight:700;}
  .sheet-del-btn{
    background:var(--panel2); border:1px solid var(--danger-dim); color:var(--danger);
    border-radius:3px; width:22px; height:22px; font-size:11px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center; margin-left:4px;
  }
  .sheet-cell-input{
    width:38px; background:none; border:none; color:var(--text); font-size:11.5px;
    text-align:center; padding:2px; font-weight:600;
  }
  .sheet-cell-input:focus{outline:1px solid var(--yellow); border-radius:2px; background:var(--panel2);}
  .sheet-cell-empty{color:var(--border); text-align:center; display:inline-block; width:38px;}
  .sheet-datehead{text-align:center;}
  .sheet-empty{padding:40px 18px; text-align:center; color:var(--text-dim); font-size:13px; line-height:1.6; white-space:normal;}

  .sheet-tabs{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; display:flex;
    background:#101010; border-top:1px solid var(--border); z-index:50;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet-tab{
    flex:1; text-align:center; padding:13px 4px; background:none; border:none;
    color:var(--text-dim); font-size:12px; font-weight:700; border-top:2px solid transparent;
  }
  .sheet-tab.active{color:var(--yellow); border-top-color:var(--yellow); background:var(--panel);}
</style>
</head>

function uid(){ return 'ex_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// helper: build an exercise + its seeded "last time" session from the Excel plans
function mkEx(list, seedLogs, name, group, sets){
  const ex = { id: uid(), name, group };
  list.push(ex);
  const baseAt = new Date(SEED_DATE + "T12:00:00").getTime();
  seedLogs[ex.id] = [{ date: SEED_DATE, sets: sets.map(([w,r], i) => ({weight:w, reps:r, at: baseAt + i})) }];
  return ex;
}

let extraRows = {};       // exId -> zusätzliche, manuell hinzugefügte Satz-Zeilen (nur für die aktuelle Session, nicht persistiert)
let workoutStartedAt = null; // Zeitpunkt des letzten "Start" — trennt die aktuelle Einheit von alten Häkchen

let trainingState = { running:false, startedAt:null, frozen:0 };
let restState = { running:false, startedAt:null, frozen:0 };

function getElapsedMs(state){
  return state.running ? (Date.now() - state.startedAt) : state.frozen;
}
function fmtTime(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  const mm = String(m).padStart(2,"0");
  const ss = String(s).padStart(2,"0");
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function startTimer(state){
  state.running = true;
  state.startedAt = Date.now();
  state.frozen = 0;
}
function stopTimer(state){
  if(state.running){
    state.frozen = Date.now() - state.startedAt;
    state.running = false;
    state.startedAt = null;
  }
}
function updateRestUI(){
  const valEl = document.getElementById("rest-timer-value");
  if(valEl) valEl.textContent = fmtTime(getElapsedMs(restState));
  const btnEl = document.querySelector('[data-action="toggle-rest-timer"]');
  if(btnEl){
    btnEl.textContent = restState.running ? "Stop" : "Start";
    btnEl.classList.toggle("running", restState.running);
  }
}
function tickTimers(){
  if(trainingState.running){
    const el = document.getElementById("training-timer-value");
    if(el) el.textContent = fmtTime(getElapsedMs(trainingState));
  }
  if(restState.running){
    const el = document.getElementById("rest-timer-value");
    if(el) el.textContent = fmtTime(getElapsedMs(restState));
  }
}
setInterval(tickTimers, 1000);

function renderTimerBarHtml(){
  return `<div class="timer-bar">

      <div>

      </div>
      <button class="timer-btn ${restState.running ? "running" : ""}" data-action="toggle-rest-timer">${restState.running ? "Stop" : "Start"}</button>
    </div>
  </div>`;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  const [y,m,d] = iso.split("-");
  return d + "." + m + "." + y.slice(2);
}

// Läuft die Datei in der Claude-Vorschau, nutzen wir Claudes Speicher.
// Wird sie eigenständig geöffnet (z.B. vom Homescreen aus), gibt es kein window.storage —
// dann speichern wir stattdessen dauerhaft direkt auf dem Gerät (localStorage).
const useClaudeStorage = !!(window.storage && typeof window.storage.get === "function");

async function storageGet(key){
  if(useClaudeStorage) return await window.storage.get(key);
  const v = localStorage.getItem(key);
  if(v === null) throw new Error("not found");
  return { key, value: v };
}
async function storageSet(key, value){
  if(useClaudeStorage) return await window.storage.set(key, value);
  localStorage.setItem(key, value);
  return { key, value };
}

async function loadData(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){ data = JSON.parse(res.value); }
    else { throw new Error("empty"); }
  } catch(e){
    data = buildDefaultData();
    await saveData();
  }
  render();
}
async function saveData(){
  try{ await storageSet(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ console.error("Speichern fehlgeschlagen", e); }
}

function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtW(w){
  return (Math.round(w*10)/10).toString().replace(/\.0$/, "");
}

function findExercise(id){
  for(const day of Object.keys(data.plans)){
    const found = data.plans[day].find(e=>e.id===id);
    if(found) return found;
  }
  return null;
}
function findExerciseDay(id){
  for(const day of Object.keys(data.plans)){
    if(data.plans[day].find(e=>e.id===id)) return day;
  }
  return null;
}
function getSessions(exId){
  return (data.logs[exId] || []).slice().sort((a,b)=> a.date.localeCompare(b.date));
}

// Alle jemals geloggten Sätze einer Übung, chronologisch flach sortiert (unabhängig vom Kalendertag).
function allSetsFlat(exId){
  const out = [];
  (data.logs[exId] || []).forEach(entry=>{
    entry.sets.forEach(s=>{
      out.push({ date: entry.date, weight: s.weight, reps: s.reps, at: s.at || 0 });
    });
  });
  out.sort((a,b)=> a.at - b.at);
  return out;
}
// Sätze, die seit Beginn der AKTUELLEN Trainingseinheit (seit "Start") abgehakt wurden.
function getSessionCheckedSets(exId){
  if(workoutStartedAt === null) return [];
  return allSetsFlat(exId).filter(s => s.at >= workoutStartedAt);
}
// Die letzte abgeschlossene Einheit VOR dem aktuellen Start — als "Letztes Mal"-Referenz,
// egal ob das gestern war oder heute schon einmal (z.B. bei einem erneuten Start am selben Tag).
function getPriorReferenceSession(exId){
  const cutoff = workoutStartedAt === null ? Infinity : workoutStartedAt;
  const prior = allSetsFlat(exId).filter(s => s.at < cutoff);
  if(prior.length === 0) return null;
  const lastDate = prior[prior.length-1].date;
  const sets = prior.filter(s => s.date === lastDate).map(s => ({weight:s.weight, reps:s.reps}));
  return { date: lastDate, sets };
}

  const app = document.getElementById("app");

  else if(view === "day") app.appendChild(renderDay());

}

function renderExerciseCard(ex){
  const priorSession = getPriorReferenceSession(ex.id);
  const sessionSets = getSessionCheckedSets(ex.id);
  const checkedCount = sessionSets.length;
  const rowCount = Math.max(3 + (extraRows[ex.id]||0), checkedCount);

  const rows = [];
  for(let i=0;i<rowCount;i++){
    const isChecked = i < checkedCount;
    const prevSet = (priorSession && priorSession.sets[i]) ? priorSession.sets[i] : null;
    const prevTxt = prevSet ? `${fmtW(prevSet.weight)}kg×${prevSet.reps}` : "–";

    let midHtml, checkHtml;
    if(isChecked){
      const s = sessionSets[i];
      midHtml = `<div class="set-static">${fmtW(s.weight)}</div><div class="set-static">${s.reps}</div>`;
      const isLastChecked = i === checkedCount - 1;
      checkHtml = isLastChecked
        ? `<button class="set-check done" data-action="uncheck-set" data-ex="${ex.id}" data-idx="${i}">✓</button>`
        : `<button class="set-check done" disabled>✓</button>`;
    } else {
      const wVal = prevSet ? fmtW(prevSet.weight) : "";
      const rVal = prevSet ? prevSet.reps : "";
      midHtml = `<input type="number" inputmode="decimal" step="0.5" min="0" class="set-input weight-input" data-ex="${ex.id}" data-idx="${i}" value="${wVal}">`
              + `<input type="number" inputmode="numeric" min="0" class="set-input reps-input" data-ex="${ex.id}" data-idx="${i}" value="${rVal}">`;
      const isNext = i === checkedCount;
      checkHtml = isNext
        ? `<button class="set-check" data-action="check-set" data-ex="${ex.id}" data-idx="${i}">✓</button>`
        : `<button class="set-check" disabled>✓</button>`;
    }

    rows.push(`<div class="set-row ${isChecked ? "done" : ""}" style="display:contents">
      <div class="set-num">${i+1}</div>
      <div class="set-prev">${prevTxt}</div>
      ${midHtml}
      ${checkHtml}
    </div>`);
  }

  return el(`<div class="ex-card" data-exid="${ex.id}">
    <div class="ex-top">
      <div>
        <div class="ex-name">${esc(ex.name)}</div>
        ${ex.group ? `<div class="ex-meta">${esc(ex.group)}</div>` : ``}
      </div>
      <div class="ex-icons">
        <button class="icon-btn chart-btn" data-action="chart" data-exid="${ex.id}" title="Fortschritt">📈</button>
        <button class="icon-btn" data-action="edit" data-exid="${ex.id}" title="Bearbeiten">✎</button>
        <button class="icon-btn danger" data-action="delete" data-exid="${ex.id}" title="Löschen">🗑</button>
      </div>
    </div>
    <div class="set-table">
      <div class="thead"></div><div class="thead">Letztes Mal</div><div class="thead">Kg</div><div class="thead">Wdh</div><div class="thead"></div>
      ${rows.join("")}
    </div>
    <button class="add-set-row" data-action="add-set-row" data-exid="${ex.id}">+ Satz hinzufügen</button>
  </div>`);
}

const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
function romanOrNum(i){ return ROMAN[i] || String(i+1); }

// Sammelt für einen Tag ALLE jemals genutzten Übungen (auch entfernte) und alle Datums-Spalten.
function buildSheetData(day){
  const exercises = data.plans[day];
  const dateSet = new Set();
  exercises.forEach(ex => (data.logs[ex.id] || []).forEach(entry => dateSet.add(entry.date)));
  const dates = [...dateSet].sort();
  const maxSetsByDate = {};
  dates.forEach(d=>{
    let max = 1;
    exercises.forEach(ex=>{
      const entry = (data.logs[ex.id] || []).find(e => e.date === d);
      if(entry && entry.sets.length > max) max = entry.sets.length;
    });
    maxSetsByDate[d] = max;
  });
  return { exercises, dates, maxSetsByDate };
}

function buildRowCells(ex, dates, maxSetsByDate, field){
  if(dates.length === 0) return `<td>–</td>`;
  let html = "";
  dates.forEach(d=>{
    const n = maxSetsByDate[d];
    const entry = (data.logs[ex.id] || []).find(e => e.date === d);
    for(let i=0;i<n;i++){
      const s = entry && entry.sets[i];
      if(s){
        const val = field === "weight" ? fmtW(s.weight) : s.reps;
        html += `<td><input type="number" inputmode="decimal" class="sheet-cell-input" data-exid="${ex.id}" data-date="${d}" data-slot="${i}" data-field="${field}" value="${val}"></td>`;
      } else {
        html += `<td><span class="sheet-cell-empty">–</span></td>`;
      }
    }
  });
  return html;
}

function buildSheetTableHtml(exercises, dates, maxSetsByDate){
  let headDates = `<th class="lbl-col">Übung</th><th class="lbl-col2">Gruppe</th><th class="lbl-col3"></th>`;
  let headSets = `<th class="lbl-col"></th><th class="lbl-col2"></th><th class="lbl-col3"></th>`;
  if(dates.length === 0){
    headDates += `<th>—</th>`;
    headSets += `<th>—</th>`;
  } else {
    dates.forEach(d=>{
      const n = maxSetsByDate[d];
      headDates += `<th class="sheet-datehead" colspan="${n}">${fmtDate(d)}</th>`;
      for(let i=0;i<n;i++) headSets += `<th class="sheet-datehead">${romanOrNum(i)}</th>`;
    });
  }

  let bodyHtml = "";
  exercises.forEach(ex=>{
    const removedTag = ex.removed ? ` <span style="color:var(--text-dim); font-size:9px; font-weight:400;">(entfernt)</span>` : "";
    bodyHtml += `<tr>
      <td class="lbl-col" rowspan="2">
        <input class="sheet-name-input" data-exname="${ex.id}" value="${esc(ex.name)}">${removedTag}
      </td>
      <td class="lbl-col2" rowspan="2">
        <input class="sheet-group-input" data-exgroup="${ex.id}" value="${esc(ex.group||'')}" placeholder="–">
      </td>
      <td class="lbl-col3"><span class="sheet-rowtype">Kg</span></td>
      ${buildRowCells(ex, dates, maxSetsByDate, "weight")}
    </tr>
    <tr>
      <td class="lbl-col3">
        <span class="sheet-rowtype">Wdh</span>
        <button class="sheet-del-btn" data-action="sheet-delete-ex" data-exid="${ex.id}" title="Übung endgültig löschen">🗑</button>
      </td>
      ${buildRowCells(ex, dates, maxSetsByDate, "reps")}
    </tr>`;
  });

  return `<div class="sheet-scroll"><table class="sheet-table">
    <thead><tr>${headDates}</tr><tr>${headSets}</tr></thead>
    <tbody>${bodyHtml}</tbody>
  </table></div>`;
}

function computeYScale(maxWeight){
  // Raster immer ein Vielfaches von 5kg (5, 10, 15 ... oder gröber bei hohen Gewichten),
  // damit z.B. 22.5kg sauber zwischen zwei Linien Platz hat und die Zahlen nicht zu dicht stehen.
  const safeMax = Math.max(maxWeight, 5);
  const padded = safeMax * 1.15;
  const candidates = [5,10,15,20,25,30,40,50,60,75,100,125,150,200,250,300,400,500,750,1000];
  let step = candidates[candidates.length-1];
  for(const c of candidates){
    if(Math.ceil(padded / c) <= 6){ step = c; break; }
  }
  const top = step * Math.ceil(padded / step);
  const lines = [];
  for(let v=0; v<=top; v+=step) lines.push(v);
  return { top, lines };
}

function renderChart(sessions){
  if(sessions.length === 0){
    return el(`<div class="empty-state" style="padding:24px 6px;">Noch keine Daten für einen Verlauf.<br>Sobald du Sessions einträgst, erscheint hier deine Kurve.</div>`);
  }

  // ein Punkt pro Einheit = höchstes an dem Tag bewegtes Gewicht, Wiederholungen sind irrelevant
  const points = sessions.map(s => ({
    date: s.date,
    weight: Math.max(...s.sets.map(x=>x.weight))
  }));

  const maxW = Math.max(...points.map(p=>p.weight));
  const { top: yTop, lines: yLines } = computeYScale(maxW);

  const W = 300, H = 178, padL = 36, padR = 10, padT = 16, padB = 22;
  const xStep = points.length > 1 ? (W - padL - padR) / (points.length - 1) : 0;
  const coords = points.map((p,i)=>{
    const x = padL + (points.length > 1 ? i*xStep : (W-padL-padR)/2);
    const y = padT + (H-padT-padB) * (1 - p.weight/yTop);
    return {x, y, ...p};
  });

  const pathD = coords.map((c,i)=> (i===0 ? "M":"L") + c.x.toFixed(1) + "," + c.y.toFixed(1)).join(" ");
  const areaD = pathD + ` L${coords[coords.length-1].x.toFixed(1)},${H-padB} L${coords[0].x.toFixed(1)},${H-padB} Z`;

  const dots = coords.map((c,i)=> {
    const isLast = i === coords.length-1;
    return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${isLast?4.2:2.5}" fill="#F6EA26" opacity="${isLast?1:0.75}"/>`;
  }).join("");

  // Gewicht links, in 5kg-Vielfachen gerastert (0kg an der Basis, wie im Referenzbild)
  const gridHtml = yLines.map(v=>{
    const y = padT + (H-padT-padB) * (1 - v/yTop);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#242420" stroke-width="1"/>`
      + `<text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="8" fill="#95958c" text-anchor="end" font-family="Inter">${v}kg</text>`;
  }).join("");

  // Tag unten
  const n = coords.length;
  let labelIdxs = [0];
  if(n > 4){ labelIdxs.push(Math.round((n-1)/3), Math.round((n-1)*2/3)); }
  else if(n > 2){ labelIdxs.push(Math.round((n-1)/2)); }
  if(n > 1) labelIdxs.push(n-1);
  labelIdxs = [...new Set(labelIdxs)];
  const xLabels = labelIdxs.map(i => {
    const c = coords[i];
    return `<text x="${c.x.toFixed(1)}" y="${H-6}" font-size="8" fill="#95958c" text-anchor="middle" font-family="Inter">${fmtDate(c.date)}</text>`;
  }).join("");

  const svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F6EA26" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#F6EA26" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridHtml}
    <path d="${areaD}" fill="url(#fadeGrad)"/>
    <path d="${pathD}" fill="none" stroke="#F6EA26" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    ${xLabels}
  </svg>`;

  const first = points[0];
  const last = points[points.length-1];
  const priorMax = points.length > 1 ? Math.max(...points.slice(0,-1).map(p=>p.weight)) : -Infinity;
  const isPR = points.length > 1 && last.weight > priorMax;

  const heroHtml = `<div class="chart-hero">
    <div class="chart-hero-left">
      <span class="chart-hero-val">${fmtW(last.weight)}kg</span>
      <span class="chart-hero-date">${fmtDate(last.date)}</span>
    </div>
    ${isPR ? `<div class="pr-badge">PR</div>` : ``}
  </div>`;

  let deltaHtml = "";
  if(points.length > 1){
    const delta = last.weight - first.weight;
    const sign = delta > 0 ? "+" : "";
    deltaHtml = `<div class="chart-delta">${sign}${fmtW(delta)}kg seit dem ersten Eintrag (${fmtDate(first.date)})</div>`;
  }

  return el(`<div>${heroHtml}${deltaHtml}${svg}</div>`);
}

/* ---------- EVENTS ---------- */

function attachEvents(){
  const app = document.getElementById("app");

  app.querySelectorAll(".routine-card").forEach(card => card.addEventListener("click", ()=>{
    currentDay = card.dataset.day;
    view = "day";
    editingExId = null;
    extraRows = {};
    workoutStartedAt = Date.now();
    startTimer(trainingState);
    restState = { running:false, startedAt:null, frozen:0 };
    render();
  }));

  const openSheets = app.querySelector("#open-sheets");
  if(openSheets) openSheets.addEventListener("click", ()=>{ view = "sheets"; render(); });

  const backHomeSheets = app.querySelector("#back-home-sheets");
  if(backHomeSheets) backHomeSheets.addEventListener("click", ()=>{ view = "home"; render(); });

  app.querySelectorAll(".sheet-tab").forEach(t=>{
    t.addEventListener("click", ()=>{ currentSheetDay = t.dataset.sheetday; render(); });
  });

  const exitBtn = app.querySelector("#exit-workout");
  if(exitBtn) exitBtn.addEventListener("click", ()=>{
    stopTimer(trainingState); stopTimer(restState);
    workoutStartedAt = null;
    view = "home"; editingExId = null; render();
  });
  const finishBtn = app.querySelector("#finish-workout");
  if(finishBtn) finishBtn.addEventListener("click", ()=>{
    stopTimer(trainingState); stopTimer(restState);
    workoutStartedAt = null;
    view = "home"; editingExId = null; render();
  });

  const backDay = app.querySelector("#back-day");
  if(backDay) backDay.addEventListener("click", ()=>{ view = "day"; render(); });

  const addExBtn = app.querySelector("#add-ex-btn");
  if(addExBtn) addExBtn.addEventListener("click", ()=>{ editingExId = "__new__"; render(); });

  app.querySelectorAll('[data-action="edit"]').forEach(b=>{
    b.addEventListener("click", ()=>{ editingExId = b.dataset.exid; render(); });
  });
  app.querySelectorAll('[data-action="cancel-form"]').forEach(b=>{
    b.addEventListener("click", ()=>{ editingExId = null; render(); });
  });
  app.querySelectorAll('[data-action="save-form"]').forEach(b=>{
    b.addEventListener("click", async ()=>{
      const name = app.querySelector("#form-name").value.trim();
      const group = app.querySelector("#form-group").value.trim();
      if(!name) return;
      if(b.dataset.exid === "__new__"){
        data.plans[currentDay].push({id: uid(), name, group});
      } else {
        const ex = findExercise(b.dataset.exid);
        if(ex){ ex.name = name; ex.group = group; }
      }
      editingExId = null;
      await saveData();
      render();
    });
  });

  app.querySelectorAll('[data-action="delete"]').forEach(b=>{
    b.addEventListener("click", async ()=>{
      if(!confirm("Diese Übung aus dem Trainingsplan nehmen? Sie taucht danach nicht mehr im Workout auf, bleibt aber in \"Workoutz\" weiterhin sichtbar.")) return;
      const ex = findExercise(b.dataset.exid);
      if(ex){
        ex.removed = true;
        await saveData();
        render();
      }
    });
  });

  app.querySelectorAll('[data-action="chart"]').forEach(b=>{
    b.addEventListener("click", ()=>{ currentExId = b.dataset.exid; view = "exercise"; render(); });
  });

  app.querySelectorAll('[data-action="check-set"]').forEach(b=>{
    b.addEventListener("click", async ()=>{
      const exid = b.dataset.ex;
      const idx = parseInt(b.dataset.idx, 10);
      const wInput = app.querySelector(`.weight-input[data-ex="${exid}"][data-idx="${idx}"]`);
      const rInput = app.querySelector(`.reps-input[data-ex="${exid}"][data-idx="${idx}"]`);
      const w = parseFloat(wInput.value);
      const r = parseInt(rInput.value, 10);
      if(!(w > 0) || !(r > 0)){
        wInput.style.borderColor = w > 0 ? "var(--border)" : "var(--danger)";
        rInput.style.borderColor = r > 0 ? "var(--border)" : "var(--danger)";
        return;
      }
      if(!data.logs[exid]) data.logs[exid] = [];
      const today = todayStr();
      let entry = data.logs[exid].find(s => s.date === today);
      if(!entry){ entry = {date: today, sets: []}; data.logs[exid].push(entry); }
      entry.sets.push({weight:w, reps:r, at: Date.now()});
      await saveData();
      startTimer(restState);
      render();
    });
  });

  app.querySelectorAll('[data-action="uncheck-set"]').forEach(b=>{
    b.addEventListener("click", async ()=>{
      const exid = b.dataset.ex;
      const sessionSets = getSessionCheckedSets(exid);
      if(sessionSets.length === 0) return;
      const last = sessionSets[sessionSets.length - 1];
      const entry = (data.logs[exid]||[]).find(s => s.date === last.date);
      if(entry){
        const idx = entry.sets.findIndex(s => s.at === last.at);
        if(idx >= 0) entry.sets.splice(idx, 1);
        if(entry.sets.length === 0){
          data.logs[exid] = data.logs[exid].filter(s => s.date !== last.date);
        }
        await saveData();
        render();
      }
    });
  });

  app.querySelectorAll('[data-action="add-set-row"]').forEach(b=>{
    b.addEventListener("click", ()=>{
      extraRows[b.dataset.exid] = (extraRows[b.dataset.exid]||0) + 1;
      render();
    });
  });

  const restBtn = app.querySelector('[data-action="toggle-rest-timer"]');
  if(restBtn) restBtn.addEventListener("click", ()=>{
    restState.running ? stopTimer(restState) : startTimer(restState);
    updateRestUI();
  });

  app.querySelectorAll('.sheet-name-input').forEach(inp=>{
    inp.addEventListener("blur", async ()=>{
      const val = inp.value.trim();
      if(!val) { inp.value = findExercise(inp.dataset.exname)?.name || ""; return; }
      const ex = findExercise(inp.dataset.exname);
      if(ex && ex.name !== val){ ex.name = val; await saveData(); render(); }
    });
  });
  app.querySelectorAll('.sheet-group-input').forEach(inp=>{
    inp.addEventListener("blur", async ()=>{
      const ex = findExercise(inp.dataset.exgroup);
      const val = inp.value.trim();
      if(ex && ex.group !== val){ ex.group = val; await saveData(); render(); }
    });
  });
  app.querySelectorAll('.sheet-cell-input').forEach(inp=>{
    inp.addEventListener("blur", async ()=>{
      const { exid, date, slot, field } = inp.dataset;
      const entry = (data.logs[exid]||[]).find(e => e.date === date);
      if(!entry || !entry.sets[Number(slot)]) return;
      const raw = inp.value.trim();
      const num = parseFloat(raw);
      if(raw === "" || isNaN(num)){
        entry.sets.splice(Number(slot), 1);
        if(entry.sets.length === 0){
          data.logs[exid] = data.logs[exid].filter(e => e.date !== date);
        }
      } else {
        entry.sets[Number(slot)][field] = num;
      }
      await saveData();
      render();
    });
  });
  app.querySelectorAll('[data-action="sheet-delete-ex"]').forEach(b=>{
    b.addEventListener("click", async ()=>{
      if(!confirm("Diese Übung inkl. ihres GESAMTEN Verlaufs endgültig löschen? Das kann nicht rückgängig gemacht werden.")) return;
      const exid = b.dataset.exid;
      const day = findExerciseDay(exid);
      if(day){
        data.plans[day] = data.plans[day].filter(e => e.id !== exid);
        delete data.logs[exid];
        await saveData();
        render();
      }
    });
  });
}

loadData();
</script>
</body>
</html>
