<style>
  :root{
    --ink:#2C2222; --plum:#3A2E2E; --mauve:#8A6E6E; --mauve-soft:#A98E8E;
    --rose:#F2E4E4; --rose-soft:#F8EEEE; --cream:#FBF4F2; --paper:#FDFAF9;
    --bordeaux:#C98B8B; --berry:#9E5566; --berry-dark:#824456;
    --line:#EBDCDA; --line-strong:#E0CCCA;
    --good:#5E8168; --warn:#B0824F; --danger:#B05B63;
    --shadow:0 1px 2px rgba(58,46,46,.05), 0 12px 30px -18px rgba(58,46,46,.35);
    --serif:'Cormorant Garamond','Didot','Bodoni MT',Georgia,'Times New Roman',serif;
    --sans:'Jost',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; line-height:1.5; font-weight:400;
  }
  .wrap{max-width:960px; margin:0 auto; padding:0 20px 64px}
  /* ---------- header ---------- */
  .top{
    position:sticky; top:0; z-index:20;
    background:
      radial-gradient(120% 180% at 12% -40%, rgba(255,255,255,.35), transparent 55%),
      radial-gradient(140% 220% at 100% 0%, rgba(158,85,102,.10), transparent 60%),
      var(--cream);
    border-bottom:1px solid var(--line);
  }
  .top-in{max-width:960px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px}
  .brand{display:flex; align-items:baseline; gap:12px; cursor:pointer; user-select:none}
  .brand .mark{font-family:var(--serif); font-weight:600; font-size:27px; letter-spacing:.14em; color:var(--plum)}
  .brand .mark b{color:var(--berry); font-weight:600}
  .brand .tag{font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:var(--mauve)}
  .top .studio-link{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--mauve);
    background:none; border:1px solid var(--line-strong); border-radius:999px; padding:8px 15px; cursor:pointer;
    transition:.2s;
  }
  .top .studio-link:hover{color:var(--berry); border-color:var(--bordeaux)}
  /* ---------- shared type ---------- */
  h1,h2,h3{font-family:var(--serif); font-weight:500; color:var(--plum); margin:0}
  .eyebrow{font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--mauve); margin:0 0 6px}
  .lead{color:var(--mauve); font-size:15px; margin:6px 0 0}
  .muted{color:var(--mauve)}
  /* ---------- steps ---------- */
  .steps{display:flex; gap:6px; flex-wrap:wrap; margin:26px 0 8px; align-items:center}
  .steps .st{display:flex; align-items:center; gap:9px; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--mauve-soft)}
  .steps .st .n{width:23px; height:23px; border-radius:50%; border:1px solid var(--line-strong); display:grid; place-items:center; font-size:11px; color:var(--mauve)}
  .steps .st.on{color:var(--plum)}
  .steps .st.on .n{background:var(--berry); border-color:var(--berry); color:#fff}
  .steps .st.done .n{background:var(--rose); border-color:var(--bordeaux); color:var(--berry)}
  .steps .sep{width:20px; height:1px; background:var(--line-strong)}
  /* ---------- layout ---------- */
  .grid{display:grid; grid-template-columns:1fr 320px; gap:26px; align-items:start; margin-top:22px}
  @media(max-width:800px){ .grid{grid-template-columns:1fr} .summary{order:-1} }
  .panelhead{margin:2px 0 16px}
  .panelhead h2{font-size:29px; line-height:1.1}
  /* service cards */
  .cat{margin:0 0 26px}
  .cat h3{font-size:14px; letter-spacing:.24em; text-transform:uppercase; color:var(--berry); font-family:var(--sans); font-weight:500; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line)}
  .svc{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-radius:13px; padding:14px 16px; margin-bottom:10px;
    cursor:pointer; transition:.16s; box-shadow:var(--shadow); font-family:inherit;
  }
  .svc:hover{border-color:var(--bordeaux); transform:translateY(-1px)}
  .svc.sel{border-color:var(--berry); background:var(--rose-soft)}
  .svc .info{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .svc .nm{font-size:16px; color:var(--ink)}
  .svc .du{font-size:12.5px; color:var(--mauve); margin-top:2px}
  .svc .pr{font-family:var(--serif); font-size:20px; color:var(--plum); white-space:nowrap}
  .svc .tick{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line-strong); display:grid; place-items:center; color:#fff; flex:none; transition:.16s}
  .svc.sel .tick{background:var(--berry); border-color:var(--berry)}
  .svc .tick svg{opacity:0; transition:.16s}
  .svc.sel .tick svg{opacity:1}
  /* summary / ticket */
  .summary{position:sticky; top:88px}
  .ticket{background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
  .ticket .th{background:var(--rose); padding:15px 18px; border-bottom:1px solid var(--line)}
  .ticket .th .eyebrow{margin:0}
  .ticket .th .tt{font-family:var(--serif); font-size:20px; color:var(--plum); margin-top:2px}
  .ticket .body{padding:16px 18px}
  .line{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px}
  .line:last-of-type{border-bottom:none}
  .line .l{color:var(--ink)} .line .r{color:var(--plum); white-space:nowrap}
  .line .x{color:var(--mauve-soft); cursor:pointer; padding:0 4px}
  .line .x:hover{color:var(--danger)}
  .empty{color:var(--mauve); font-size:14px; padding:10px 0 4px}
  .tot{display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; padding-top:12px; border-top:1px solid var(--line-strong)}
  .tot .l{font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--mauve)}
  .tot .r{font-family:var(--serif); font-size:28px; color:var(--berry)}
  .subtot{font-size:12.5px; color:var(--mauve); text-align:right; margin-top:2px}
  /* buttons */
  .btn{font-family:var(--sans); font-size:13px; letter-spacing:.12em; text-transform:uppercase; border-radius:999px; padding:13px 22px; cursor:pointer; border:1px solid transparent; transition:.18s; font-weight:500}
  .btn.primary{background:var(--berry); color:#fff}
  .btn.primary:hover{background:var(--berry-dark)}
  .btn.primary:disabled{background:var(--line-strong); color:#fff; cursor:not-allowed}
  .btn.ghost{background:transparent; border-color:var(--line-strong); color:var(--plum)}
  .btn.ghost:hover{border-color:var(--bordeaux); color:var(--berry)}
  .btn.block{width:100%; display:block}
  .btn.sm{padding:8px 14px; font-size:11px}
  .navrow{display:flex; justify-content:space-between; gap:12px; margin-top:22px}
  /* month calendar */
  .calhead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
  .calhead .mnav{width:38px; height:38px; border-radius:50%; border:1px solid var(--line-strong); background:#fff; color:var(--plum); font-size:16px; cursor:pointer; transition:.15s}
  .calhead .mnav:hover{border-color:var(--bordeaux); color:var(--berry)}
  .calhead .mnav:disabled{opacity:.35; cursor:not-allowed}
  .calhead select{font-family:var(--serif); font-size:20px; color:var(--plum); border:none; background:transparent; cursor:pointer; padding:4px 2px; text-align:center}
  .calhead select:focus{outline:none}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .calwd{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--mauve); text-align:center; padding:4px 0 8px}
  .cd{position:relative; border:1px solid var(--line); background:#fff; border-radius:10px; min-height:52px; padding:6px 3px 4px; text-align:center; cursor:pointer; transition:.14s; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:2px}
  .cd:hover:not(.dis):not(.out){border-color:var(--bordeaux)}
  .cd .n{font-family:var(--serif); font-size:17px; color:var(--plum); line-height:1}
  .cd .lbl{font-size:8.5px; color:var(--mauve); line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis}
  .cd.out{background:var(--cream); cursor:default}
  .cd.out .n{color:#D8C8C6}
  .cd.dis{background:var(--cream); cursor:not-allowed}
  .cd.dis .n,.cd.dis .lbl{color:var(--mauve-soft)}
  .cd.today:not(.sel) .n{color:var(--berry)}
  .cd.extra{background:var(--rose-soft); border-color:var(--bordeaux)}
  .cd.extra .lbl{color:var(--berry)}
  .cd.sel{background:var(--berry); border-color:var(--berry)}
  .cd.sel .n,.cd.sel .lbl{color:#fff}
  .slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:9px; margin-top:8px}
  .slot{border:1px solid var(--line); background:#fff; border-radius:10px; padding:11px 0; text-align:center; cursor:pointer; font-size:14.5px; color:var(--plum); transition:.14s; font-family:var(--sans)}
  .slot:hover:not(.taken){border-color:var(--bordeaux)}
  .slot.sel{background:var(--berry); border-color:var(--berry); color:#fff}
  .slot.taken{color:var(--mauve-soft); text-decoration:line-through; cursor:not-allowed; background:var(--cream)}
  .closed-note{color:var(--mauve); font-size:14px; padding:18px 0}
  /* mobile app feel */
  .steps-box{
    background:var(--rose-soft); border-top:1px solid var(--line); margin-top:8px; padding:12px 14px;
    border-radius:0 0 13px 13px; font-size:13px; color:var(--plum); line-height:1.7; white-space:pre-line;
    animation:stepfade .25s ease;
  }
  .steps-box .stitle{font-weight:500; font-size:14px; margin-bottom:4px}
  @keyframes stepfade{from{opacity:0;max-height:0} to{opacity:1;max-height:600px}}
  .svc.sel{border-radius:13px 13px 0 0}
  .svc.sel+.steps-box{display:block}
  .outside-note{
    background:var(--cream); border:1px dashed var(--bordeaux); border-radius:12px;
    padding:14px 16px; margin-top:20px; font-size:13.5px; color:var(--plum); line-height:1.55;
  }
  .outside-note b{color:var(--berry)}
  .social{display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:30px 0 8px}
  .soc-btn{display:inline-flex; align-items:center; gap:10px; text-decoration:none;
    background:#fff; border:1px solid var(--line-strong); border-radius:999px;
    padding:11px 20px; box-shadow:var(--shadow); transition:.16s;
    font-family:var(--sans); font-size:13.5px; letter-spacing:.02em; color:var(--plum)}
  .soc-btn:hover{border-color:var(--bordeaux); transform:translateY(-1px)}
  .soc-btn svg{flex:none}
  @media(max-width:640px){
    .wrap{padding:0 12px 24px}
    .top-in{padding:12px 14px}
    .brand .mark{font-size:22px}
    .brand .tag{font-size:9px; letter-spacing:.26em}
    .panelhead h2{font-size:23px}
    .lead{font-size:14px}
    .steps{gap:4px; margin-top:18px}
    .steps .st{font-size:9.5px; letter-spacing:.1em; gap:6px}
    .steps .st .n{width:19px; height:19px; font-size:10px}
    .steps .sep{width:10px}
    .svc{padding:12px 13px; gap:11px}
    .svc .nm{font-size:15px}
    .svc .pr{font-size:18px}
    .cd{min-height:47px; border-radius:8px}
    .cd .n{font-size:15px}
    .cd .lbl{font-size:7.5px}
    .slots{grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:7px}
    .slot{padding:12px 0}
    .card{padding:14px}
    .summary{position:static}
    .navrow{position:sticky; bottom:0; z-index:10; background:linear-gradient(to top, var(--paper) 62%, transparent); padding:16px 0 12px; margin-top:16px}
    .navrow .btn{flex:1; padding:14px 10px}
    .metrics{grid-template-columns:1fr 1fr; gap:10px}
    .metric .v{font-size:25px}
    .bk{padding:13px 13px}
    .ticket .body{padding:13px 14px}
  }
  /* form */
  .field{margin-bottom:16px}
  .field label{display:block; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--mauve); margin-bottom:7px}
  .field input,.field textarea,.field select{
    width:100%; font-family:var(--sans); font-size:15px; color:var(--ink);
    background:#fff; border:1px solid var(--line-strong); border-radius:11px; padding:12px 14px; transition:.15s;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none; border-color:var(--berry); box-shadow:0 0 0 3px rgba(158,85,102,.12)}
  .field textarea{resize:vertical; min-height:72px}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:520px){ .row2{grid-template-columns:1fr} }
  /* confirmation */
  .done-card{background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:40px 32px; text-align:center; max-width:520px; margin:30px auto}
  .seal{width:64px; height:64px; border-radius:50%; background:var(--rose); display:grid; place-items:center; margin:0 auto 18px; color:var(--berry)}
  .ref{display:inline-block; font-family:var(--serif); font-size:22px; letter-spacing:.14em; color:var(--berry); background:var(--rose-soft); border:1px dashed var(--bordeaux); border-radius:10px; padding:8px 18px; margin:14px 0}
  /* card generic */
  .card{background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px}
  /* ---------- studio ---------- */
  .metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:22px 0}
  .metrics.two{grid-template-columns:repeat(2,1fr); max-width:520px}
  @media(max-width:700px){ .metrics{grid-template-columns:repeat(2,1fr)} }
  .metric{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow)}
  .metric .k{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mauve)}
  .metric .v{font-family:var(--serif); font-size:30px; color:var(--plum); margin-top:4px; line-height:1}
  .metric .s{font-size:12px; color:var(--mauve); margin-top:3px}
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 16px}
  .tab{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--mauve); background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 15px; cursor:pointer; transition:.15s}
  .tab:hover{border-color:var(--bordeaux)}
  .tab.on{background:var(--plum); color:var(--cream); border-color:var(--plum)}
  .tab.trash{margin-left:auto; border-color:#E3C4C6; color:var(--danger)}
  .tab.trash:hover{background:#FBF0F1; border-color:var(--danger)}
  .bk{background:#fff; border:1px solid var(--line); border-radius:14px; padding:15px 17px; margin-bottom:11px; box-shadow:var(--shadow); display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
  .bk .when{text-align:center; flex:none; min-width:60px}
  .bk .when .d{font-family:var(--serif); font-size:23px; color:var(--plum); line-height:1}
  .bk .when .m{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mauve)}
  .bk .when .t{margin-top:6px; font-size:14px; color:var(--berry)}
  .bk .mid{flex:1; min-width:180px}
  .bk .who{font-size:16px; color:var(--ink)}
  .bk .svcs{font-size:13.5px; color:var(--mauve); margin-top:3px}
  .bk .meta{font-size:12.5px; color:var(--mauve-soft); margin-top:6px}
  .bk .side{display:flex; flex-direction:column; align-items:flex-end; gap:9px}
  .bk .amt{font-family:var(--serif); font-size:20px; color:var(--plum)}
  .pill{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; padding:4px 10px; border-radius:999px; border:1px solid}
  .pill.neu{color:var(--berry); border-color:var(--bordeaux); background:var(--rose-soft)}
  .pill.bestätigt{color:var(--good); border-color:#B9CDBF; background:#F1F6F2}
  .pill.erledigt{color:var(--mauve); border-color:var(--line-strong); background:var(--cream)}
  .pill.storniert{color:var(--danger); border-color:#E3C4C6; background:#FBF0F1}
  .actions{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
  .link{background:none; border:none; color:var(--mauve); font-family:var(--sans); font-size:12px; letter-spacing:.06em; cursor:pointer; padding:4px 6px; text-decoration:underline; text-underline-offset:3px}
  .link:hover{color:var(--berry)}
  .link.danger:hover{color:var(--danger)}
  .barrow{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  /* settings table */
  .srow{display:grid; grid-template-columns:1.6fr .9fr .7fr .7fr auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line)}
  .srow input,.srow select{font-family:var(--sans); font-size:14px; border:1px solid var(--line-strong); border-radius:9px; padding:9px 10px; background:#fff; width:100%}
  .srow .hd{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mauve)}
  @media(max-width:640px){ .srow{grid-template-columns:1fr 1fr; } .srow .hdrow{display:none} }
  .hours{display:grid; grid-template-columns:120px 1fr 1fr auto; gap:10px; align-items:center; padding:7px 0}
  .hours .wd{color:var(--plum)}
  .hours input[type=time]{font-family:var(--sans); border:1px solid var(--line-strong); border-radius:9px; padding:8px 10px}
  /* pin */
  .pinbox{max-width:360px; margin:60px auto; text-align:center}
  .pininput{font-family:var(--serif); font-size:30px; letter-spacing:.5em; text-align:center; width:100%; border:1px solid var(--line-strong); border-radius:12px; padding:14px; margin:18px 0 8px; background:#fff; color:var(--plum)}
  /* toast */
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--plum); color:var(--cream); padding:12px 20px; border-radius:999px; font-size:13px; letter-spacing:.06em; box-shadow:0 12px 30px -12px rgba(58,46,46,.6); opacity:0; pointer-events:none; transition:.28s; z-index:60}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  /* fade */
  .view{animation:fade .3s ease}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media(prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
  :focus-visible{outline:2px solid var(--berry); outline-offset:2px}
  .hidden{display:none!important}
  .note-inline{font-size:12.5px; color:var(--mauve); margin-top:10px; line-height:1.55}
</style>
</head>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NailSalon",
  "name": "VELOUR Aesthetic",

<script>
(function(){
  "use strict";

  /* ---------------- storage ---------------- */
  const KEY='velour:data';
  const MEM={};
  const hasStore = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
  const Store={
    async load(){
      if(hasStore){ try{ const r=await window.storage.get(KEY,true); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return MEM[KEY]||null; } }
      try{ const ls=window.localStorage.getItem(KEY); if(ls) return JSON.parse(ls); }catch(e){}
      return MEM[KEY]||null;
    },
    async save(d){
      MEM[KEY]=d;
      if(hasStore){ try{ await window.storage.set(KEY, JSON.stringify(d), true); return; }catch(e){} }
      try{ window.localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
    }
  };

  /* ---------------- defaults ---------------- */
  const DEFAULT_SERVICES=[
    {id:'f1',cat:'Maniküre',name:'Naturnägel',dur:60,price:50,
      steps:'💅 Naturnägel\n• Hände desinfizieren\n• Nägel kürzen & in Form feilen\n• Nagelhaut entfernen\n• Naturnagel vorbereiten\n• Aufbau mit klarem Gel\n• Aushärten\n• In Form feilen\n• Versiegeln\n• Nagelöl'},
    {id:'f2',cat:'Maniküre',name:'Nägel mit einer Farbe',dur:75,price:60,
      steps:'💅 Gel – Eine Farbe\n• Hände desinfizieren\n• Nägel kürzen & in Form feilen\n• Nagelhaut entfernen\n• Naturnagel vorbereiten\n• Gel-Aufbau\n• Aushärten\n• In Form feilen\n• Farbgel auftragen\n• Versiegeln\n• Nagelöl'},
    {id:'f3',cat:'Maniküre',name:'French oder Ombré',dur:90,price:70,
      steps:'💅 Gel – French oder Ombré\n• Hände desinfizieren\n• Nägel kürzen & in Form feilen\n• Nagelhaut entfernen\n• Naturnagel vorbereiten\n• Gel-Aufbau\n• Aushärten\n• In Form feilen\n• French oder Ombré gestalten\n• Versiegeln\n• Nagelöl'},
    {id:'f4',cat:'Maniküre',name:'Deko / Design',dur:15,price:10,
      steps:'✨ Deko / Design\n• Glitzer\n• Steinchen\n• Chrome\n• Nail Art\n• Sticker\n• Handgemalte Designs\n• Weitere Extras nach Aufwand'},
    {id:'p1',cat:'Pediküre',name:'Eine Farbe',dur:50,price:40,
      steps:'🦶 Fussnägel – Eine Farbe\n• Füsse desinfizieren\n• Nägel kürzen & feilen\n• Nagelhaut säubern\n• Nagel vorbereiten\n• Farbgel auftragen\n• Aushärten\n• Versiegeln\n• Nagelöl'},
    {id:'p2',cat:'Pediküre',name:'French oder Deko',dur:60,price:50,
      steps:'🦶 Fussnägel – French oder Deko\n• Füsse desinfizieren\n• Nägel kürzen & feilen\n• Nagelhaut säubern\n• Nagel vorbereiten\n• French oder Design gestalten\n• Aushärten\n• Versiegeln\n• Nagelöl'},
    {id:'b1',cat:'Brows & Lashes',name:'Wimpernlifting',dur:60,price:95,
      steps:'💫 Wimpernlifting\n• Augenpartie reinigen\n• Wimpern aufteilen & fixieren\n• Lifting-Serum auftragen\n• Fixier-Serum auftragen\n• Färben (im Preis inbegriffen)\n• Pflegeserum'},
    {id:'b2',cat:'Brows & Lashes',name:'Browlifting',dur:45,price:75,
      steps:'💫 Browlifting\n• Augenbrauen reinigen\n• In Form fixieren\n• Lifting-Serum auftragen\n• Fixier-Serum auftragen\n• Optional: Färben\n• Pflege'},
    {id:'b3',cat:'Brows & Lashes',name:'Augenbrauen zupfen',dur:15,price:20,
      steps:'✨ Augenbrauen zupfen\n• Form festlegen\n• Zupfen & in Form bringen\n• Beruhigende Pflege'},
    {id:'b4',cat:'Brows & Lashes',name:'Augenbrauen färben',dur:20,price:25,
      steps:'✨ Augenbrauen färben\n• Reinigen\n• Auftragen & einwirken\n• Farbe entfernen\n• Form prüfen'}
  ];
  // hours: index 0=So .. 6=Sa. null = geschlossen
  const DEFAULT_CONFIG={
    pinHash:'37c47c5c',
    slot:30,
    email:'velouraesthetic.lachen@gmail.com',
    gcalUrl:'https://script.google.com/macros/s/AKfycbzrIUnpI38Oby6OM1bZnzczU3nznPF4HFVDf_Iz9gJZ9JxOJZVzrZY2kB3U5hnpIw1-LA/exec',
    hoursVersion:4,
    hours:{0:null,1:['08:00','15:00'],2:['08:00','15:00'],3:['08:00','15:00'],4:['08:00','15:00'],5:['08:00','15:00'],6:null}
  };
  function hashPin(p){
    const s='VELOUR:'+p+':lachen';
    let h=0x811c9dc5>>>0;
    for(let i=0;i<s.length;i++){ h=(h^s.charCodeAt(i))>>>0; h=Math.imul(h,0x01000193)>>>0; }
    for(let r=0;r<5000;r++){ h=Math.imul(h^0x9e3779b9,0x85ebca6b)>>>0; h=(h^(h>>>15))>>>0; }
    return h.toString(16).padStart(8,'0');
  }

  /* ---------------- state ---------------- */
  let state={services:[],bookings:[],config:{}};
  // customer selection
  let sel={items:[],date:null,time:null,name:'',phone:'',email:'',note:''};
  let step=1;
  let mode='customer';          // customer | studio
  let studioAuthed=false;
  let studioTab='anfragen';    // anfragen | anstehend | storniert
  let studioView='dash';        // dash | settings

  /* ---------------- helpers ---------------- */
  const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const WD_LONG=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const MO=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const money=n=>'CHF '+(Number.isInteger(n)?n+'.–':n.toFixed(2));
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const svcById=id=>state.services.find(s=>s.id===id);
  const activeItems=()=>sel.items.map(svcById).filter(Boolean);
  const totalPrice=list=>list.reduce((a,s)=>a+(+s.price||0),0);
  const totalDur=list=>list.reduce((a,s)=>a+(+s.dur||0),0);
  const pad=n=>String(n).padStart(2,'0');
  const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parseYMD=s=>{const[y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);};
  const t2m=t=>{const[h,m]=t.split(':').map(Number); return h*60+m;};
  const m2t=m=>pad(Math.floor(m/60))+':'+pad(m%60);
  const isActiveB=b=>b.status!=='storniert';
  function newRef(){return 'VLR-'+Math.random().toString(36).slice(2,6).toUpperCase();}
  function fmtLongDate(s){const d=parseYMD(s); return WD_LONG[d.getDay()]+', '+d.getDate()+'. '+MO[d.getMonth()]+' '+d.getFullYear();}

  function persist(){ Store.save(state); }

  function toast(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove('show'),2200);
  }

  /* ---------------- slots & availability ---------------- */
  const BUF=30; // Minuten Puffer nach jeder Behandlung
  const MO_LONG=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const WD_MON=['Mo','Di','Mi','Do','Fr','Sa','So'];

  // Eidgenössische Feiertage (jedes Jahr automatisch berechnet)
  const HOL={};
  function easterDate(y){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
          g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
          l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
          mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
    return new Date(y,mo-1,da);
  }
  function holidayName(ds){
    const y=+ds.slice(0,4);
    if(!HOL[y]){
      const e=easterDate(y); const auf=new Date(e); auf.setDate(e.getDate()+39);
      HOL[y]={};
      HOL[y][y+'-01-01']='Neujahr';
      HOL[y][ymd(auf)]='Auffahrt';
      HOL[y][y+'-08-01']='Bundesfeiertag';
      HOL[y][y+'-12-25']='Weihnachten';
    }
    return HOL[y][ds]||null;
  }
  // Sondertag: von Hand freigegebener Tag (z. B. Samstag) mit eigenen Zeiten
  function openDayInfo(ds){
    return (state.config.openDays||[]).find(o=>o.date===ds) || null;
  }
  function blockedInfo(ds){
    const b=(state.config.blocked||[]).find(x=>x.from<=ds && ds<=(x.to||x.from));
    return b ? (b.reason||'Geschlossen') : null;
  }
  // Status eines Tages für den Kalender
  function dayInfo(ds){
    const today=ymd(new Date());
    if(ds<today) return {ok:false,label:''};
    const h=holidayName(ds); if(h) return {ok:false,label:h};
    const bl=blockedInfo(ds); if(bl!==null) return {ok:false,label:bl};
    const od=openDayInfo(ds); if(od) return {ok:true,label:'Zusatztermin'};
    if(!dayOpen(ds)) return {ok:false,label:'Geschlossen'};
    return {ok:true,label:''};
  }
  function dayOpen(dateStr){ const d=parseYMD(dateStr); return !!state.config.hours[d.getDay()]; }
  // Öffnungszeiten eines konkreten Tages (Sondertag hat Vorrang)
  function hoursFor(ds){
    const od=openDayInfo(ds);
    if(od) return [od.from, od.to];
    const d=parseYMD(ds);
    return state.config.hours[d.getDay()] || null;
  }
  function slotsFor(dateStr){
    const h=hoursFor(dateStr);
    if(!h) return [];
    const [o,c]=h; const step=state.config.slot||30;
    const list=[]; for(let m=t2m(o); m<=t2m(c)-step; m+=step) list.push(m2t(m));
    return list;
  }
  // frei, wenn Behandlung (Dauer D) + 30 Min. Puffer keine bestehende Buchung überschneidet
  function slotAvailable(ds,t,D){
    const h=hoursFor(ds);
    if(!h) return false;
    if(isPast(ds,t)) return false;
    const s=t2m(t);
    if(s+D>t2m(h[1])) return false; // Behandlung muss vor Ladenschluss enden
    const e=s+D+BUF;
    const clashLocal=state.bookings.some(b=>{
      if(!isActiveB(b)||b.date!==ds) return false;
      const bs=t2m(b.time), be=bs+(b.dur||30)+BUF;
      return s<be && bs<e;
    });
    if(clashLocal) return false;
    const busy=(busyCache[ds]||[]);
    const clashGcal=busy.some(iv=> s<iv.e && iv.s<e );
    return !clashGcal;
  }

  /* --- Google Kalender lesen (Zwei-Wege): belegte Zeiten holen --- */
  const busyCache={};        // 'YYYY-MM-DD' -> [{s,e} in Minuten]
  const busyFetched={};      // 'YYYY-MM' -> true/'loading'
  window.__velourBusy=function(monthKey,data){
    busyFetched[monthKey]=true;
    try{
      (data&&data.events||[]).forEach(ev=>{
        const ds=ev.date; if(!busyCache[ds]) busyCache[ds]=[];
        busyCache[ds].push({s:ev.start, e:ev.end});
      });
    }catch(e){}
    if(mode==='customer'&&step===2) render();
  };
  function fetchBusy(Y,M){
    if(!state.config.gcalUrl) return;
    const key=Y+'-'+pad(M+1);
    if(busyFetched[key]) return;
    busyFetched[key]='loading';
    const from=Y+'-'+pad(M+1)+'-01';
    const to=ymd(new Date(Y,M+1,0));
    const cb='__velourBusy_'+key.replace('-','_');
    window[cb]=function(data){ window.__velourBusy(key,data); try{delete window[cb];}catch(e){} };
    const url=state.config.gcalUrl+(state.config.gcalUrl.includes('?')?'&':'?')
      +'action=busy&from='+from+'&to='+to+'&callback='+cb;
    const sc=document.createElement('script');
    sc.src=url; sc.async=true;
    sc.onerror=function(){ busyFetched[key]=false; };
    document.head.appendChild(sc);
  }
  function isPast(dateStr,time){
    const now=new Date(); const d=parseYMD(dateStr);
    if(ymd(now)!==dateStr) return d<new Date(now.getFullYear(),now.getMonth(),now.getDate());
    return t2m(time) <= (now.getHours()*60+now.getMinutes());
  }

  /* ---------------- Google Calendar ---------------- */
  function bookingServices(b){ return (b.items||[]).map(id=>{const s=svcById(id); return s?s.name:'';}).filter(Boolean).join(', '); }
  function gcalDates(b){
    const [Y,M,D]=b.date.split('-').map(Number);
    const sm=t2m(b.time), em=sm+(b.dur||30);
    const fmt=mins=>`${Y}${pad(M)}${pad(D)}T${pad(Math.floor(mins/60))}${pad(mins%60)}00`;
    return fmt(sm)+'/'+fmt(em);
  }
  function gcalUrl(b){
    const title='VELOUR · '+b.name;
    const details=[
      'Behandlungen: '+bookingServices(b),
      'Telefon: '+b.phone,
      b.email?'E-Mail: '+b.email:'',
      'Preis: '+money(b.total||0),
      'Dauer: '+(b.dur||0)+' Min.',
      'Referenz: '+b.ref,
      b.note?'Notiz: '+b.note:''
    ].filter(Boolean).join('\n');
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
      +'&text='+encodeURIComponent(title)
      +'&dates='+gcalDates(b)
      +'&details='+encodeURIComponent(details);
  }
  function bridgePayload(b){
    return { action:'confirm', ref:b.ref, name:b.name, phone:b.phone, email:b.email||'', date:b.date, time:b.time,
             durationMin:b.dur||30, total:b.total||0, services:bookingServices(b), note:b.note||'' };
  }
  function confirmText(b){
    const dur=b.dur||0;
    return 'Liebe '+b.name+'\n\n'
      +'Dein Termin bei VELOUR Aesthetic ist best\u00e4tigt, wir freuen uns auf dich!\n\n'
      +'\u2022 '+fmtLongDate(b.date)+', '+b.time+' Uhr\n'
      +'\u2022 '+bookingServices(b)+'\n'
      +'\u2022 Dauer ca. '+dur+' Minuten\n\n'
      +'Falls dir etwas dazwischenkommt, gib uns einfach kurz Bescheid.\n\nBis bald & liebe Gr\u00fcsse\nLejla \u263A\uFE0F';
  }
  function waLink(b){
    let n=String(b.phone||'').replace(/[^0-9]/g,'');
    if(n.startsWith('0')) n='41'+n.slice(1);
    else if(n.startsWith('0041')) n='41'+n.slice(4);
    return 'https://wa.me/'+n+'?text='+encodeURIComponent(confirmText(b));
  }

  /* =====================================================
     RENDER — router
  ===================================================== */
  function render(){
    const mb=document.getElementById('modeBtn');
    if(mb) mb.textContent = (mode==='studio') ? 'Zur Buchung' : 'Studio';
    const app=document.getElementById('app');
    if(mode==='studio'){ app.innerHTML = studioAuthed ? (studioView==='settings'?viewSettings():viewStudio()) : viewPin(); }
    else{ app.innerHTML = viewCustomer(); }
    // focus pin
    const pin=document.getElementById('pinInput'); if(pin) pin.focus();
  }

  /* ---------------- CUSTOMER ---------------- */
  function stepsBar(){
    const labels=['Behandlung','Termin','Kontakt','Anfrage'];
    let h='<div class="steps">';
    labels.forEach((l,i)=>{
      const n=i+1; const cls = step===n?'on': (step>n?'done':'');
      h+=`<div class="st ${cls}"><span class="n">${step>n?'✓':n}</span>${l}</div>`;
      if(i<labels.length-1) h+='<span class="sep"></span>';
    });
    return h+'</div>';
  }
  function ticket(showActions){
    const list=activeItems();
    let rows = list.length ? list.map(s=>`
      <div class="line"><span class="l">${esc(s.name)}</span>
      <span class="r">${money(s.price)} ${showActions?`<span class="x" title="Entfernen" onclick="App.rmItem('${s.id}')">✕</span>`:''}</span></div>`).join('')
      : '<div class="empty">Noch keine Behandlung gewählt.</div>';
    const dur=totalDur(list);
    const meta = (sel.date&&sel.time) ? `<div class="line"><span class="l">Termin</span><span class="r">${WD[parseYMD(sel.date).getDay()]}, ${parseYMD(sel.date).getDate()}. ${MO[parseYMD(sel.date).getMonth()]} · ${sel.time}</span></div>` : '';
    return `
    <div class="ticket">
      <div class="th"><p class="eyebrow">Deine Auswahl</p><div class="tt">Terminübersicht</div></div>
      <div class="body">
        ${rows}${meta}
        <div class="tot"><span class="l">Total</span><span class="r">${money(totalPrice(list))}</span></div>
        ${dur?`<div class="subtot">Dauer ca. ${dur} Min.</div>`:''}
      </div>
    </div>`;
  }

  function viewCustomer(){
    if(step===5) return viewDone()+socialFooter();
    let main='';
    if(step===1) main=stepServices();
    if(step===2) main=stepTime();
    if(step===3) main=stepDetails();
    if(step===4) main=stepReview();
    return `<div class="view">${stepsBar()}
      <div class="grid">
        <div>${main}</div>
        <div class="summary">${ticket(step===1)}</div>
      </div>${socialFooter()}</div>`;

  function socialFooter(){
    return `<div class="social">
      <a class="soc-btn" href="https://instagram.com/velouraesthetic_" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <defs><linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FEDA75"/><stop offset="25%" stop-color="#FA7E1E"/>
            <stop offset="50%" stop-color="#D62976"/><stop offset="75%" stop-color="#962FBF"/>
            <stop offset="100%" stop-color="#4F5BD5"/></linearGradient></defs>
          <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)"/>
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="#fff" stroke-width="1.7"/>
          <circle cx="17.2" cy="6.8" r="1.3" fill="#fff"/>
        </svg>
        <span>Instagram</span>
      </a>
      <a class="soc-btn" href="https://share.google/t8Dut7PZs2JMbJR47" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
          <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.69 28.18c-.44-1.32-.69-2.73-.69-4.18s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
          <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
        </svg>
        <span>Auf Google bewerten</span>
      </a>
    </div>`;
  }

  function stepServices(){
    const visible=state.services.filter(s=>!s.hidden);
    const cats=[...new Set(visible.map(s=>s.cat))];
    let h=`<div class="panelhead"><p class="eyebrow">Schritt 1</p><h2>Welche Behandlung darf es sein?</h2><p class="lead">Wähle eine oder mehrere Behandlungen aus.</p></div>`;
    cats.forEach(cat=>{
      h+=`<div class="cat"><h3>${esc(cat)}</h3>`;
      visible.filter(s=>s.cat===cat).forEach(s=>{
        const on=sel.items.includes(s.id);
        h+=`<button class="svc ${on?'sel':''}" onclick="App.toggleItem('${s.id}')">
          <span class="tick"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="info"><span class="nm">${esc(s.name)}</span><span class="du">${s.dur} Min.</span></span>
          <span class="pr">${money(s.price)}</span></button>`;
        if(on && s.steps){
          h+=`<div class="steps-box">${esc(s.steps)}</div>`;
        }
      });
      h+='</div>';
    });
    h+=`<div class="outside-note"><b>Termine ausserhalb der Öffnungszeiten?</b><br>In Ausnahmefällen sind Termine ausserhalb der regulären Zeiten möglich, sofern es die Umstände zulassen. Kontaktiere uns telefonisch, damit wir eine Lösung finden.</div>`;
    h+=`<div class="outside-note" style="border-style:solid; border-color:var(--line-strong)"><b>Gut zu wissen:</b> Deine Auswahl ist eine Terminanfrage. Der Termin ist erst definitiv gebucht, sobald du von uns eine <b>Terminbestätigung</b> erhältst.</div>`;
    h+=`<div class="navrow"><span></span><button class="btn primary" ${sel.items.length?'':'disabled'} onclick="App.next()">Weiter zum Termin →</button></div>`;
    return h;
  }

  function stepTime(){
    if(sel.mOff==null) sel.mOff=0;
    const now=new Date();
    const base=new Date(now.getFullYear(), now.getMonth()+sel.mOff, 1);
    const Y=base.getFullYear(), M=base.getMonth();
    const MAXM=5;
    // Monatsauswahl
    let opts='';
    for(let i=0;i<=MAXM;i++){
      const d=new Date(now.getFullYear(),now.getMonth()+i,1);
      opts+=`<option value="${i}" ${i===sel.mOff?'selected':''}>${MO_LONG[d.getMonth()]} ${d.getFullYear()}</option>`;
    }
    // Raster: beginnt am Montag der Woche des 1.; endet am Sonntag der letzten Woche
    const first=new Date(Y,M,1);
    fetchBusy(Y,M);
    cloudFetchBookingsForSlots();
    const startIdx=(first.getDay()+6)%7; // Mo=0
    const daysInMonth=new Date(Y,M+1,0).getDate();
    const rows=Math.ceil((startIdx+daysInMonth)/7);
    const start=new Date(Y,M,1-startIdx);
    const todayS=ymd(new Date());
    let grid=WD_MON.map(w=>`<div class="calwd">${w}</div>`).join('');
    for(let i=0;i<rows*7;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const ds=ymd(d); const out=d.getMonth()!==M;
      const info=dayInfo(ds);
      const disabled=out||!info.ok;
      const on=sel.date===ds;
      const label=out?'':info.label;
      const isExtra=!out && info.ok && openDayInfo(ds);
      grid+=`<div class="cd ${out?'out':''} ${(!out&&!info.ok)?'dis':''} ${isExtra?'extra':''} ${on?'sel':''} ${ds===todayS?'today':''}"
        ${disabled?'':`onclick="App.pickDate('${ds}')"`} ${label?`title="${esc(label)}"`:''}>
        <span class="n">${d.getDate()}</span>${label?`<span class="lbl">${esc(label)}</span>`:''}</div>`;
    }
    // Uhrzeiten für gewählten Tag
    const D=totalDur(activeItems());
    let slotsHtml='<p class="closed-note">Bitte einen Tag im Kalender wählen.</p>';
    if(sel.date){
      const ss=slotsFor(sel.date);
      const items=ss.map(t=>{
        const free=slotAvailable(sel.date,t,D);
        const on=sel.time===t;
        return `<div class="slot ${on?'sel':''} ${free?'':'taken'}" ${free?`onclick="App.pickTime('${t}')"`:''}>${t}</div>`;
      }).join('');
      const anyFree=ss.some(t=>slotAvailable(sel.date,t,D));
      slotsHtml=`<p class="eyebrow" style="margin:16px 0 8px">${fmtLongDate(sel.date)} · Dauer ca. ${D} Min.</p>`
        + (ss.length? `<div class="slots">${items}</div>` : '<p class="closed-note">An diesem Tag geschlossen.</p>')
        + (ss.length&&!anyFree? '<p class="closed-note">Dieser Tag ist bereits ausgebucht – bitte einen anderen Tag wählen.</p>':'');
    }
    return `<div class="panelhead"><p class="eyebrow">Schritt 2</p><h2>Wann passt es dir?</h2><p class="lead">Wähle Tag und Uhrzeit.</p></div>
      <div class="card">
        <div class="calhead">
          <button class="mnav" ${sel.mOff<=0?'disabled':''} onclick="App.navMonth(-1)" aria-label="Voriger Monat">‹</button>
          <select onchange="App.setMonth(this.value)" aria-label="Monat wählen">${opts}</select>
          <button class="mnav" ${sel.mOff>=MAXM?'disabled':''} onclick="App.navMonth(1)" aria-label="Nächster Monat">›</button>
        </div>
        <div class="calgrid">${grid}</div>
        ${slotsHtml}
      </div>
      <div class="outside-note"><b>Samstagstermine</b><br>Samstage geben wir jeweils kurzfristig frei, sobald unser Wochenplan feststeht – meist rund eine Woche im Voraus. Ein freigegebener Samstag erscheint hier ganz normal buchbar. Wenn du schon jetzt einen Samstag möchtest, melde dich telefonisch bei uns.</div>
      <div class="navrow"><button class="btn ghost" onclick="App.prev()">← Zurück</button>
      <button class="btn primary" ${sel.date&&sel.time?'':'disabled'} onclick="App.next()">Weiter →</button></div>`;
  }

  /* ---------------- STUDIO: dashboard ---------------- */
  // gültige Buchung? (schützt vor Fehlerzeilen aus dem Sheet)
  function isValidB(b){
    if(!b) return false;
    if(!b.date || !/^\d{4}-\d{2}-\d{2}$/.test(String(b.date))) return false;
    if(!b.time || !/^\d{1,2}:\d{2}/.test(String(b.time))) return false;
    if(!b.internal && !String(b.name||'').trim()) return false;
    if(String(b.ref||'').indexOf('FEHLER')!==-1) return false;
    return true;
  }
  function studioBookings(){
    const today=ymd(new Date());
    let list=state.bookings.filter(isValidB);
    if(studioTab==='storniert'){
      list=list.filter(b=>b.status==='storniert');
      list.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
      return list;
    }
    if(studioTab==='anfragen'){
      // alle offenen Anfragen, die noch bestätigt oder storniert werden müssen
      list=list.filter(b=>b.status==='neu' && !b.internal);
      list.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
      return list;
    }
    // anstehend = bestätigte (und interne) Termine ab heute
    list=list.filter(b=>(b.status==='bestätigt'||b.status==='erledigt'||b.internal) && b.date>=today);
    list.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
    return list;
  }
  function metrics(){
    const today=ymd(new Date());
    const now=new Date(); const dow=(now.getDay()+6)%7; // Mo=0
    const mon=new Date(now); mon.setDate(now.getDate()-dow); mon.setHours(0,0,0,0);
    const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    const inWeek=b=>{const d=parseYMD(b.date); return d>=mon&&d<=sun;};
    // nur gültige, bestätigte/erledigte Termine zählen
    const conf=state.bookings.filter(b=>isValidB(b) && !b.internal &&
      (b.status==='bestätigt'||b.status==='erledigt'));
    const weekRev=conf.filter(inWeek).reduce((a,b)=>a+(b.total||0),0);
    const todays=conf.filter(b=>b.date===today).length;
    return {today:todays, weekRev};
  }
  function viewStudio(){
    const m=metrics();
    const valid=state.bookings.filter(isValidB);
    const cNeu=valid.filter(b=>b.status==='neu'&&!b.internal).length;
    const cStorn=valid.filter(b=>b.status==='storniert').length;
    const tabs=[
      ['anfragen', 'Anfragen'+(cNeu?' ('+cNeu+')':'')],

      ['storniert','Storniert'+(cStorn?' ('+cStorn+')':'')]
    ];
    const list=studioBookings();
    const emptyText = studioTab==='anfragen'
      ? 'Keine offenen Anfragen. Neue Terminanfragen erscheinen hier automatisch.'
      : (studioTab==='anstehend'
        ? 'Keine bestätigten Termine. Bestätige eine Anfrage, dann erscheint sie hier.'

    const cards = list.length ? list.map(bkCard).join('')
      : `<div class="card" style="text-align:center; color:var(--mauve)">${emptyText}</div>`;
    return `<div class="view">

      </div>
      <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${studioTab===k?'on':''}" onclick="App.setTab('${k}')">${l}</button>`).join('')}${studioTab==='storniert'&&list.length?`<button class="tab trash" title="Alle stornierten Termine löschen" onclick="App.clearCancelled()">🗑 Alle löschen</button>`:''}</div>
      ${cards}
    </div>`;
  }
  function bkCard(b){
    const d=parseYMD(b.date);
    const st=b.status||'neu';
    if(b.internal){
      return `<div class="bk">
        <div class="when"><div class="d">${d.getDate()}</div><div class="m">${MO[d.getMonth()]}</div><div class="t">${esc(b.time)}</div></div>
        <div class="mid">
          <div class="who">🔒 Gesperrt${b.name?' · '+esc(b.name):''}</div>
          <div class="svcs">${WD_LONG[d.getDay()]} · ${b.time}–${esc(m2t(t2m(b.time)+(b.dur||0)))} Uhr</div>
        </div>
        <div class="side">
          <span class="pill erledigt">intern</span>
          <div class="actions"><button class="link danger" onclick="App.setStatus('${b.id}','storniert')">Entfernen</button></div>
        </div>
      </div>`;
    }
    const svcNames=(b.items&&b.items.length) ? b.items.map(id=>{const s=svcById(id); return s?s.name:'—';}).join(' · ') : (b.cloudServices||'—');
    let acts='';
    if(st==='storniert'){
      acts+=`<button class="link" onclick="App.setStatus('${b.id}','neu')">Zurück zu Anfragen</button>`;
      acts+=`<button class="link danger" title="Endgültig löschen" onclick="App.deleteBooking('${b.id}')">🗑 Löschen</button>`;
    } else if(st==='neu'){
      // Anfrage: bestätigen oder stornieren
      if(b.phone) acts+=`<button class="link" onclick="App.openWA('${b.id}')">WhatsApp</button>`;
      acts+=`<button class="link" onclick="App.setStatus('${b.id}','bestätigt')">✓ Bestätigen</button>`;
      acts+=`<button class="link danger" onclick="App.setStatus('${b.id}','storniert')">✕ Stornieren</button>`;
    } else {
      // bestätigt / erledigt
      acts+=`<button class="link" onclick="App.openGCal('${b.id}')">＋ Kalender</button>`;
      if(b.phone) acts+=`<button class="link" onclick="App.openWA('${b.id}')">WhatsApp</button>`;
      if(st!=='erledigt') acts+=`<button class="link" onclick="App.setStatus('${b.id}','erledigt')">Erledigt</button>`;
      acts+=`<button class="link danger" onclick="App.setStatus('${b.id}','storniert')">Stornieren</button>`;
    }
    return `<div class="bk">
      <div class="when"><div class="d">${d.getDate()}</div><div class="m">${MO[d.getMonth()]}</div><div class="t">${esc(b.time)}</div></div>
      <div class="mid">
        <div class="who">${esc(b.name)}</div>
        <div class="svcs">${esc(svcNames)}</div>
        <div class="meta">${esc(b.phone)}${b.email?' · '+esc(b.email):''} · ${WD_LONG[d.getDay()]}</div>
        ${b.note?`<div class="meta">📝 ${esc(b.note)}</div>`:''}
      </div>
      <div class="side">
        <span class="pill ${st}">${st}</span>
        <div class="amt">${money(b.total||0)}</div>
        <div class="actions">${acts}</div>
      </div>
    </div>`;
  }

      <div class="card" style="margin-bottom:18px">
        <h3 style="font-size:20px; margin-bottom:8px">Aufräumen</h3>
        <p class="note-inline" style="margin:0 0 12px">Entfernt fehlerhafte oder unvollständige Einträge (z. B. „NaN" oder leere Zeilen) aus der Buchungsliste.</p>
        <button class="btn ghost sm" onclick="App.cleanupJunk()">Fehlerhafte Einträge entfernen</button>
      </div>

      <div class="card">
        <h3 style="font-size:20px; margin-bottom:12px">Sicherheit & Takt</h3>
        <div class="row2">
          <div class="field"><label>Neuen Studio-PIN setzen</label><input type="password" autocomplete="off" placeholder="••••" onchange="App.editPin(this.value); this.value='';"></div>
          <div class="field"><label>Zeit-Takt (Minuten)</label><input type="number" min="5" step="5" value="${state.config.slot}" onchange="App.editSlot(this.value)"></div>
        </div>
        <p class="note-inline">Der aktuelle PIN wird aus Sicherheitsgründen nirgends angezeigt. Zum Ändern einfach den neuen PIN eintippen und Enter drücken. Der Zeit-Takt bestimmt die Abstände der wählbaren Uhrzeiten (z. B. alle 30 Minuten).</p>
      </div>
    </div>`;
  }

  /* =====================================================
     APP — actions
  ===================================================== */
  const App={
    go(where){ if(where==='home'){ mode='customer'; step=1; } render(); },
    toggleMode(){
      if(mode==='studio'){ mode='customer'; studioAuthed=false; step=1; }
      else { mode='studio'; studioAuthed=false; studioView='dash'; }
      render();
    },
    openStudio(){ mode='studio'; studioAuthed=false; studioView='dash'; render(); },
    logoutStudio(){ mode='customer'; studioAuthed=false; step=1; render(); },

    /* customer */
    toggleItem(id){ const i=sel.items.indexOf(id); if(i>=0) sel.items.splice(i,1); else sel.items.push(id); render(); },
    rmItem(id){ const i=sel.items.indexOf(id); if(i>=0) sel.items.splice(i,1); render(); },
    pickDate(ds){ sel.date=ds; sel.time=null; render(); },
    pickTime(t){ sel.time=t; render(); },
    navMonth(d){ sel.mOff=Math.min(5,Math.max(0,(sel.mOff||0)+d)); render(); },
    setMonth(v){ sel.mOff=Math.min(5,Math.max(0,parseInt(v)||0)); render(); },
    field(k,v){ sel[k]=v;
      // toggle next button without full re-render for smoother typing
      const btn=document.querySelector('.navrow .btn.primary');
      if(btn){ if(step===3) btn.disabled=!(sel.name.trim()&&sel.phone.trim()); }
    },
    next(){
      if(step===1 && sel.date && sel.time){
        // Auswahl geändert? Zeit erneut prüfen (Dauer könnte länger geworden sein)
        if(!slotAvailable(sel.date,sel.time,totalDur(activeItems()))) sel.time=null;
      }
      if(step<4){ step++; render(); }
    },
    prev(){ if(step>1){ step--; render(); } },
    book(){
      const list=activeItems();
      if(!slotAvailable(sel.date,sel.time,totalDur(list))){
        toast('Dieser Termin wurde soeben vergeben \u2013 bitte neue Zeit w\u00e4hlen.');
        sel.time=null; step=2; render(); return;
      }
      const b={ id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), ref:newRef(),
        createdAt:new Date().toISOString(), date:sel.date, time:sel.time,
        items:sel.items.slice(), name:sel.name.trim(), phone:sel.phone.trim(),
        email:sel.email.trim(), note:sel.note.trim(), status:'neu',
        total:totalPrice(list), dur:totalDur(list) };
      state.bookings.push(b); persist();
      // Cloud sync: an Google Script senden
      cloudSend({action:'book', ref:b.ref, date:b.date, time:b.time, name:b.name,
        phone:b.phone, email:b.email, services:bookingServices(b),
        durationMin:b.dur, total:b.total, note:b.note});
      sel._last=b; step=5; render();
    },
    openGCal(id){ const b=state.bookings.find(x=>x.id===id); if(b) window.open(gcalUrl(b),'_blank','noopener'); },
    openWA(id){ const b=state.bookings.find(x=>x.id===id); if(b) window.open(waLink(b),'_blank','noopener'); },
    reset(){ sel={items:[],date:null,time:null,name:'',phone:'',email:'',note:'',mOff:0}; step=1; render(); },

    /* pin */
    checkPin(){
      const el=document.getElementById('pinInput');
      const v=(el||{}).value||'';
      if(hashPin(v)===state.config.pinHash){
        studioAuthed=true; studioView='dash';
        cloudFetchBookings(); // Alle Buchungen vom Server laden
        render();
      }
      else{
        const m=document.getElementById('pinMsg'); if(m) m.textContent='PIN stimmt nicht.';
        if(el){ el.value=''; el.disabled=true; setTimeout(()=>{ el.disabled=false; el.focus(); }, 1200); }
      }
    },

    /* studio */
    setTab(k){ studioTab=k; render(); },
    deleteBooking(id){
      state.bookings=state.bookings.filter(b=>b.id!==id);
      persist(); render(); toast('Termin gelöscht');
    },
    clearCancelled(){
      const n=state.bookings.filter(b=>b.status==='storniert').length;
      state.bookings=state.bookings.filter(b=>b.status!=='storniert');
      persist(); render(); toast(n+' stornierte Termine gelöscht');
    },
    cleanupJunk(){
      const before=state.bookings.length;
      state.bookings=state.bookings.filter(isValidB);
      persist(); render(); toast((before-state.bookings.length)+' fehlerhafte Einträge entfernt');
    },
    setStatus(id,st){
      const b=state.bookings.find(x=>x.id===id); if(!b) return;
      b.status=st; persist();
      if(st==='best\u00e4tigt'){
        let sent=false;
        if(state.config.gcalUrl){
          cloudSend({action:'confirm', ref:b.ref, date:b.date, time:b.time, name:b.name,
            phone:b.phone, email:b.email, services:bookingServices(b),
            durationMin:b.dur, total:b.total, note:b.note});
          sent=true;
          busyFetched[b.date.slice(0,7)]=false;
        }
        render();
        toast(sent? 'Bestätigt · jetzt im Reiter „Anstehend"' : 'Bestätigt · jetzt im Reiter „Anstehend"');
        if(b.phone) window.open(waLink(b),'_blank','noopener');
        return;
      }
      // Status-Änderung an Cloud senden
      cloudSend({action:'status', ref:b.ref, status:st});
      render();
      if(st==='storniert') toast('Storniert · jetzt im Reiter „Storniert"');
      else if(st==='neu') toast('Zurück bei den Anfragen');
      else toast('Status: '+st);
    },
    openSettings(){ studioView='settings'; render(); },
    closeSettings(){ studioView='dash'; render(); },

    /* settings edits */
    editSvc(id,k,v){ const s=svcById(id); if(!s) return; s[k]=(k==='price'||k==='dur')?(parseFloat(v)||0):v; persist(); },
    toggleHidden(id){ const s=svcById(id); if(!s) return; s.hidden=!s.hidden; persist(); render(); toast(s.hidden?'Behandlung ausgeblendet':'Behandlung wieder sichtbar'); },
    reloadServices(){ cloudFetchServices(); toast('Behandlungen werden neu geladen …'); },
    addBlock(){
      const from=(document.getElementById('bl_from')||{}).value;
      let to=(document.getElementById('bl_to')||{}).value;
      const reason=((document.getElementById('bl_reason')||{}).value||'').trim();
      if(!from){ toast('Bitte ein Datum wählen'); return; }
      if(!to) to=from;
      const a=from<=to?from:to, b=from<=to?to:from;
      if(!state.config.blocked) state.config.blocked=[];
      state.config.blocked.push({id:'bl'+Date.now().toString(36), from:a, to:b, reason:reason||'Geschlossen'});
      persist(); render(); toast('Tage gesperrt');
    },
    delBlock(id){ state.config.blocked=(state.config.blocked||[]).filter(b=>b.id!==id); persist(); render(); },
    addOpenDay(){
      const date=(document.getElementById('od_date')||{}).value;
      const from=(document.getElementById('od_from')||{}).value||'08:00';
      const to=(document.getElementById('od_to')||{}).value||'15:00';
      const note=((document.getElementById('od_note')||{}).value||'').trim();
      if(!date){ toast('Bitte ein Datum wählen'); return; }
      if(t2m(from)>=t2m(to)){ toast('„Bis" muss nach „Von" liegen'); return; }
      if(!state.config.openDays) state.config.openDays=[];
      state.config.openDays=state.config.openDays.filter(o=>o.date!==date);
      state.config.openDays.push({id:'od'+Date.now().toString(36), date:date, from:from, to:to, note:note});
      persist(); render(); toast('Tag freigegeben');
    },
    delOpenDay(id){ state.config.openDays=(state.config.openDays||[]).filter(o=>o.id!==id); persist(); render(); },
    addTimeBlock(){
      const date=(document.getElementById('tb_date')||{}).value;
      const time=(document.getElementById('tb_time')||{}).value;
      const dur=parseInt((document.getElementById('tb_dur')||{}).value)||60;
      const reason=((document.getElementById('tb_reason')||{}).value||'').trim();
      if(!date||!time){ toast('Bitte Datum und Uhrzeit wählen'); return; }
      state.bookings.push({ id:'blk'+Date.now().toString(36), internal:true, status:'bestätigt',
        date:date, time:time, dur:dur, name:reason, items:[], phone:'', total:0, ref:'INTERN' });
      persist(); render(); toast('Uhrzeit gesperrt');
    },
    addSvc(){ state.services.push({id:'s'+Date.now().toString(36),cat:'Extras',name:'Neue Behandlung',dur:30,price:30}); persist(); render(); },
    delSvc(id){ state.services=state.services.filter(s=>s.id!==id); persist(); render(); },
    editHour(day,idx,v){ const h=state.config.hours[day]; if(h){ h[idx]=v; persist(); } },
    toggleClosed(day,closed){ state.config.hours[day]= closed?null:['09:00','18:00']; persist(); render(); },
    editPin(v){ v=v.trim(); if(!v){ toast('PIN darf nicht leer sein'); return; } state.config.pinHash=hashPin(v); delete state.config.pin; persist(); toast('Neuer PIN gespeichert'); },
    editSlot(v){ state.config.slot=Math.max(5,parseInt(v)||30); persist(); },
    editGcalUrl(v){ state.config.gcalUrl=v.trim(); persist(); toast('Google-Verbindung gespeichert'); },
    field2(k,v){ state.config[k]=v.trim(); persist(); },

    /* export */
    exportCSV(){
      const sep=';'; const rows=[['Datum','Uhrzeit','Name','Telefon','E-Mail','Behandlungen','Dauer (Min)','Preis (CHF)','Status','Referenz','Notiz']];
      state.bookings.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(b=>{
        const svcs=(b.items||[]).map(id=>{const s=svcById(id); return s?s.name:'';}).join(', ');
        rows.push([b.date,b.time,b.name,b.phone,b.email||'',svcs,b.dur||'',b.total||'',b.status,b.ref,(b.note||'').replace(/\r?\n/g,' ')]);
      });
      const csv='\uFEFF'+rows.map(r=>r.map(c=>{c=String(c==null?'':c); return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(sep)).join('\r\n');
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob); const a=document.createElement('a');
      a.href=url; a.download='velour-buchungen.csv'; document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      toast('Excel-Datei (CSV) heruntergeladen');
    }
  };
  window.App=App;

  /* --- Cloud sync: Google Sheet als zentraler Speicher --- */
  function cloudSend(payload){
    if(!state.config.gcalUrl) return;
    try{
      fetch(state.config.gcalUrl,{
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(payload)
      });
    }catch(e){}
  }
  function cloudFetchBookings(){
    if(!state.config.gcalUrl) return;
    const cb='__velourBookings_'+Date.now();
    window[cb]=function(data){
      try{ delete window[cb]; }catch(e){}
      if(!data||!data.bookings) return;
      // Cloud-Buchungen mit lokalen zusammenführen (Cloud gewinnt)
      const cloudRefs=new Set();
      data.bookings.forEach(function(row){
        const ref=row.Ref||row.ref;
        if(!ref) return;
        if(String(ref).indexOf('FEHLER')!==-1) return;
        if(!/^\d{4}-\d{2}-\d{2}/.test(String(row.Datum||row.date||''))) return;
        cloudRefs.add(ref);
        const existing=state.bookings.find(b=>b.ref===ref);
        if(existing){
          // Status aus der Cloud übernehmen
          if(row.Status||row.status) existing.status=(row.Status||row.status);
        } else {
          // Neue Buchung aus der Cloud hinzufügen
          state.bookings.push({
            id:'cloud'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
            ref:ref, date:String(row.Datum||row.date||''), time:String(row.Uhrzeit||row.time||''),
            name:String(row.Name||row.name||''), phone:String(row.Telefon||row.phone||''),
            email:String(row['E-Mail']||row.email||''),
            items:[], dur:Number(row.Dauer||row.durationMin||0),
            total:Number(row.Preis||row.total||0), status:String(row.Status||row.status||'neu'),
            note:String(row.Notiz||row.note||''),
            cloudServices:String(row.Behandlungen||row.services||'')
          });
        }
      });
      persist(); render();
      toast('Buchungen synchronisiert');
    };
    const url=state.config.gcalUrl+(state.config.gcalUrl.includes('?')?'&':'?')
      +'action=bookings&callback='+cb;
    const sc=document.createElement('script');
    sc.src=url; sc.async=true;
    sc.onerror=function(){ if(window.__velourManualSync){ toast('Verbindung zum Server fehlgeschlagen'); window.__velourManualSync=false; } };
    document.head.appendChild(sc);
  }
  // Periodisch alle 2 Minuten synchronisieren, wenn im Studio eingeloggt
  setInterval(function(){ if(studioAuthed && state.config.gcalUrl) cloudFetchBookings(); }, 120000);

  /* Also: fetch bookings when customer opens time picker (to block slots from cloud) */
  function cloudFetchBookingsForSlots(){
    if(!state.config.gcalUrl) return;
    const cb='__velourSlots_'+Date.now();
    window[cb]=function(data){
      try{ delete window[cb]; }catch(e){}
      if(!data||!data.bookings) return;
      data.bookings.forEach(function(row){
        const ref=row.Ref||row.ref;
        if(!ref) return;
        if(String(ref).indexOf('FEHLER')!==-1) return;
        if(!/^\d{4}-\d{2}-\d{2}/.test(String(row.Datum||row.date||''))) return;
        if(state.bookings.find(b=>b.ref===ref)) return;
        state.bookings.push({
          id:'cloud'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
          ref:ref, date:String(row.Datum||row.date||''), time:String(row.Uhrzeit||row.time||''),
          name:'', phone:'', email:'', items:[],
          dur:Number(row.Dauer||row.durationMin||0), total:0,
          status:String(row.Status||row.status||'neu'), note:''
        });
      });
      persist(); if(mode==='customer'&&step===2) render();
    };
    const url=state.config.gcalUrl+(state.config.gcalUrl.includes('?')?'&':'?')
      +'action=bookings&callback='+cb;
    const sc=document.createElement('script'); sc.src=url; sc.async=true;
    document.head.appendChild(sc);
  }

  /* --- Behandlungen live aus dem Google Sheet laden --- */
  function cloudFetchServices(){
    if(!state.config.gcalUrl) return;
    const cb='__velourSvc_'+Date.now();
    window[cb]=function(data){
      try{ delete window[cb]; }catch(e){}
      if(!data||!data.services||!data.services.length) return;
      // Cloud-Daten übernehmen, aber Schritte aus dem Code als Rückfall behalten
      state.services=data.services.map(function(s){
        if(!s.steps || !String(s.steps).trim()){
          const local=DEFAULT_SERVICES.find(d=>d.id===s.id);
          if(local) s.steps=local.steps;
        }
        return s;
      });
      persist();
      render();
    };
    const url=state.config.gcalUrl+(state.config.gcalUrl.includes('?')?'&':'?')
      +'action=services&callback='+cb;
    const sc=document.createElement('script'); sc.src=url; sc.async=true;
    document.head.appendChild(sc);
  }

  /* ---------------- boot ---------------- */
  (async function boot(){
    const saved=await Store.load();
    if(saved&&saved.services&&saved.services.length){
      state=saved;
      state.config=Object.assign({},DEFAULT_CONFIG,state.config||{});
      if(!state.config.hours) state.config.hours=DEFAULT_CONFIG.hours;
    } else {
      state={services:DEFAULT_SERVICES.map(s=>Object.assign({},s)), bookings:[], config:JSON.parse(JSON.stringify(DEFAULT_CONFIG))};
      persist();
    }
    // migrate: old plaintext PIN -> master hash; never keep plaintext anywhere
    if(state.config.pin){ state.config.pinHash=DEFAULT_CONFIG.pinHash; delete state.config.pin; persist(); }
    if(!state.config.pinHash){ state.config.pinHash=DEFAULT_CONFIG.pinHash; persist(); }
    if(!state.config.blocked) state.config.blocked=[];
    if(!state.config.openDays) state.config.openDays=[];
    // URL immer aus dem Code übernehmen
    state.config.gcalUrl=DEFAULT_CONFIG.gcalUrl; persist();
    // Behandlungen aus dem Code als Basis (Schritte immer vorhanden)
    state.services=DEFAULT_SERVICES.map(s=>Object.assign({},s)); persist();
    // einmalige Migration auf die gewünschten Öffnungszeiten
    if(state.config.hoursVersion!==4){
      state.config.hours=JSON.parse(JSON.stringify(DEFAULT_CONFIG.hours));
      state.config.hoursVersion=4; persist();
    }
    render();
    // Behandlungen & Preise live aus dem Google Sheet holen
    cloudFetchServices();

    // hidden studio access: long-press logo (~0.7s) or #studio in URL
    const brand=document.getElementById('brand');
    if(brand){
      let timer=null, longpressed=false;
      const start=()=>{ longpressed=false; timer=setTimeout(()=>{ longpressed=true; App.openStudio(); },700); };
      const cancel=()=>{ clearTimeout(timer); };
      brand.addEventListener('pointerdown',start);
      brand.addEventListener('pointerup',cancel);
      brand.addEventListener('pointerleave',cancel);
      brand.addEventListener('pointercancel',cancel);
      brand.addEventListener('click',()=>{ if(longpressed){ longpressed=false; return; } App.go('home'); });
      brand.style.cursor='pointer';
    }
    if(location.hash==='#studio') App.openStudio();
    window.addEventListener('hashchange',()=>{ if(location.hash==='#studio') App.openStudio(); });
  })();
})();
</script>
